/* ---------------- Schedule (admin plans a session) ---------------- */
function Schedule({ t, courses, schedule, users, sites, setSites, reload, patch }){
  const [course,setCourse]=useState('');
  const [date,setDate]=useState(todayISO());
  const [site,setSite]=useState('');
  const [saveSite,setSaveSite]=useState(true);
  const [trainer,setTrainer]=useState('');
  const [msg,setMsg]=useState(null);
  const [busy,setBusy]=useState(false);
  const [showSites,setShowSites]=useState(false);

  useEffect(()=>{
    if(courses.length) setCourse(cur=>cur||String(courses[0].id));
    if(users.length) setTrainer(cur=>cur||users[0].username);
  },[courses, users]);

  const save=async()=>{
    if(!site.trim()){ setMsg({bad:true,text:'Choose a site, or pick Other and type it in.'}); return; }
    if(!course){ setMsg({bad:true,text:'Pick a course.'}); return; }
    if(!trainer){ setMsg({bad:true,text:'Pick a trainer.'}); return; }
    const siteName=canonSite(sites,site);
    const keep=saveSite&&!findSite(sites,site);

    /* Same trainer, same day: almost always a mistake, occasionally two short visits. */
    const clash=(schedule||[]).filter(s=>s.status!=='Done'&&s.trainer===trainer&&String(s.date).slice(0,10)===date);
    if(clash.length){
      const who=(users.find(u=>u.username===trainer)||{}).name||trainer;
      if(!window.confirm(who+' is already booked on '+fmtUK(date)+' at '+clash.map(c=>c.site).join(', ')+'.\n\nBook this session as well?')) return;
    }

    setBusy(true); setMsg({bad:false,text:'Saving session...'});
    try{
      const tk=store.get(SESS).token;
      const r=await api('addSchedule',{token:tk,course,date,site:siteName,trainer,saveSite:keep});
      if(r.ok){
        if(r.sites) setSites(r.sites);
        setSite(''); setSaveSite(true);
        setMsg({bad:false,text:'Session scheduled at '+siteName+'. It will appear on the trainer\'s dashboard.'+(keep&&r.sites?' '+siteName+' is now on the site list.':'')});
        reload();
      }
      else setMsg({bad:true,text:errText(r)});
    }catch(e){ setMsg({bad:true,text:'Could not reach the server. Check your internet connection.'}); }
    setBusy(false);
  };

  const del=async(s)=>{
    if(!window.confirm('Delete this planned session?'))return;
    patch.removeSchedule(s.id);
    const tk=store.get(SESS).token;
    let r=null; try{ r=await api('deleteSchedule',{token:tk,id:s.id}); }catch(e){}
    if(!r||!r.ok){ alert('Could not delete that session.'); reload(); }
  };

  const today=todayISO();
  const planned=(schedule||[]).filter(s=>s.status!=='Done').sort((a,b)=>new Date(a.date)-new Date(b.date));

  return (
    <div className="space-y-6 fade">
      <div className="flex items-center justify-between gap-3">
        <h1 className="text-2xl font-bold text-slate-900">Plan Schedule</h1>
        <button onClick={()=>setShowSites(v=>!v)} className="text-sm font-semibold hover:opacity-80 transition" style={{color:t.primary}}>{showSites?'Done':'Manage sites'}</button>
      </div>
      <p className="text-slate-600 -mt-4 text-sm">Assign a trainer to visit a site. The trainer will log in, see their schedule, and select the attendees on the day.</p>

      {showSites && <SiteManager t={t} sites={sites} setSites={setSites} />}

      <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
        <div className="p-5 grid sm:grid-cols-2 gap-4 border-b border-slate-100 bg-slate-50/50">
          <SitePicker t={t} sites={sites} value={site} onChange={setSite} required canSave save={saveSite} onSave={setSaveSite} disabled={busy} />

          <div><label className="block text-xs font-semibold text-slate-600 mb-1">Trainer</label>
            <select value={trainer} onChange={e=>setTrainer(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}}>
              {users.map(u=><option key={u.username} value={u.username}>{u.name}</option>)}
            </select></div>

          <div><label className="block text-xs font-semibold text-slate-600 mb-1">Course</label>
            <select value={course} onChange={e=>setCourse(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}}>
              {courses.map(c=><option key={c.id} value={c.id}>{c.name} {c.audit?'(audit)':`(${c.duration} months)`}</option>)}
            </select></div>

          <div><label className="block text-xs font-semibold text-slate-600 mb-1">Date</label>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} /></div>

          <div className="sm:col-span-2 pt-2"><button onClick={save} disabled={busy} style={{backgroundColor:t.secondary}} className="w-full text-white font-bold py-2.5 rounded-lg hover:brightness-110 shadow-sm transition disabled:opacity-60">{busy?'Saving...':'Schedule session'}</button></div>
        </div>
        {msg && <p className={`px-5 py-4 text-sm font-medium ${msg.bad?'text-red-600':'text-emerald-600'}`}>{msg.text}</p>}
      </div>

      <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
        <div className="p-4 border-b border-slate-100"><h2 className="font-bold text-slate-800">All planned sessions ({planned.length})</h2></div>
        <ul className="divide-y divide-slate-100">
          {planned.length===0 && <li className="p-6 text-slate-400 italic">Nothing planned.</li>}
          {planned.map(s=>{
            const trainerName = users.find(u=>u.username===s.trainer)?.name || s.trainer;
            const courseObj = courses.find(c=>c.id == s.course || c.name == s.course);
            const displayCourse = courseObj ? (courseObj.audit ? `${courseObj.name} (audit)` : `${courseObj.name} (${courseObj.duration}m)`) : s.course;

            const overdue = String(s.date).slice(0,10) < today;
            return (
              <li key={s.id} className="px-5 py-3.5 flex items-center justify-between hover:bg-slate-50 transition">
                <div className="min-w-0">
                  <p className="font-bold text-slate-800">{s.site} <span className="text-slate-500 font-medium text-sm ml-2">({displayCourse})</span></p>
                  <p className="text-xs font-medium text-slate-500 mt-0.5 flex flex-wrap items-center gap-x-1.5"><span className="text-slate-400">{fmtUK(s.date)}</span> &bull; Trainer: {trainerName} {overdue && <Badge tone="amber">Overdue - not run yet</Badge>}</p>
                </div>
                <button onClick={()=>del(s)} title="Delete this session" className="text-slate-300 hover:text-red-500 transition p-2 shrink-0"><I.trash size={18}/></button>
              </li>
            );
          })}
        </ul>
      </div>
    </div>
  );
}

/* ---------------- Dashboard ---------------- */
/* Lightweight themed donut (pure SVG, no chart library needed). */
function Donut({ title, segments, size }){
  size=size||150;
  const total=segments.reduce((n,s)=>n+s.value,0);
  const r=size/2, stroke=size*0.15, radius=r-stroke/2, circ=2*Math.PI*radius;
  let offset=0;
  return (
    <div className="flex items-center gap-5">
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="shrink-0">
        <g transform={`rotate(-90 ${r} ${r})`}>
          <circle cx={r} cy={r} r={radius} fill="none" stroke="#eef2f6" strokeWidth={stroke} />
          {total>0 && segments.filter(s=>s.value>0).map((s,i)=>{
            const len=circ*(s.value/total);
            const el=<circle key={i} cx={r} cy={r} r={radius} fill="none" stroke={s.colour} strokeWidth={stroke} strokeDasharray={`${len} ${circ-len}`} strokeDashoffset={-offset} />;
            offset+=len; return el;
          })}
        </g>
        <text x={r} y={r} textAnchor="middle" dominantBaseline="central" style={{fontSize:size*0.26,fontWeight:800,fill:'#0f172a'}}>{total}</text>
        <text x={r} y={r+size*0.21} textAnchor="middle" style={{fontSize:size*0.088,fontWeight:700,fill:'#94a3b8',letterSpacing:'.05em'}}>{String(title).toUpperCase()}</text>
      </svg>
      <div className="space-y-1.5 min-w-0">
        {segments.map((s,i)=>(
          <div key={i} className="flex items-center gap-2 text-sm">
            <span className="w-3 h-3 rounded-sm shrink-0" style={{backgroundColor:s.colour}}></span>
            <span className="text-slate-600 font-medium">{s.label}</span>
            <span className="text-slate-400 ml-auto tabular-nums pl-3">{s.value}{total>0?` \u00b7 ${Math.round(s.value/total*100)}%`:''}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function certState(row){
  if(row.certSent==='audit') return {key:'audit',tone:'blue',label:'Audit'};
  if(!row.expiryDate) return {key:'unknown',tone:'slate',label:'-'};
  const d=daysUntil(row.expiryDate);
  if(d<0) return {key:'expired',tone:'red',label:'Expired'};
  if(d<=90) return {key:'soon',tone:'amber',label:'Expiring soon'};
  return {key:'valid',tone:'green',label:'Valid'};
}
function Dashboard({ t, training, sites, onDelete, patch, me }){
  const redl=async(r)=>{
    if(!window.confirm('Download the '+r.trainingType+' certificate for '+r.employee+'?'))return;
    try{ const b64=await loadCert(CONFIG.CERT_FILE);
      const bytes=buildCertBytes(b64,{name:r.employee,trainingType:r.trainingType,trainingDate:r.trainingDate,issueDate:r.issueDate,expiryDate:r.expiryDate,instructorName:r.trainer||CONFIG.INSTRUCTOR.name,instructorTitle:(r.trainingType||'Training')+' Instructor',instructorQual:''});
      downloadBlob(new Blob([bytes],{type:DOCX_MIME}),safeName(r.trainingType)+'_'+safeName(r.employee)+'.docx');
    }catch(e){ alert('Could not build that certificate.'); }
  };
  const [filter,setFilter]=useState('');
  const [kind,setKind]=useState('all');       // all | certs | audits
  const [status,setStatus]=useState('all');   // all | valid | soon | expired
  const [siteF,setSiteF]=useState('');
  /* Old records typed "heineken" or "MUH Endoscopy " group under the listed name, and
     off-list sites that differ only in capitals group together too. */
  const seenSite={};
  const groupSite=(v)=>{ const c=canonSite(sites,v); if(!c) return ''; const k=c.toLowerCase(); return seenSite[k]||(seenSite[k]=c); };
  const rows=training.map(r=>Object.assign({},r,{st:certState(r),siteName:groupSite(rowSite(r))}));
  const count=(k)=>rows.filter(r=>r.st.key===k).length;
  const siteOpts=sortSites(Object.values(seenSite));
  const fl=filter.trim().toLowerCase();
  const shown=rows.filter(r=>{
    if(kind==='certs'&&r.certSent==='audit') return false;
    if(kind==='audits'&&r.certSent!=='audit') return false;
    if(status!=='all'&&r.st.key!==status) return false;
    if(siteF&&r.siteName!==siteF) return false;
    if(fl&&![r.employee,r.siteName,r.trainingType,r.trainer,r.notes].some(v=>String(v||'').toLowerCase().includes(fl))) return false;
    return true;
  }).sort((a,b)=>(a.expiryDate||'').localeCompare(b.expiryDate||''));
  const filtered=kind!=='all'||status!=='all'||!!siteF||!!fl;
  const clearFilters=()=>{ setKind('all'); setStatus('all'); setSiteF(''); setFilter(''); };
  const pickStatus=(k)=>{ setStatus(s=>s===k?'all':k); if(kind==='audits') setKind('all'); };

  /* Excel copy of exactly what is on screen (after filters), for clients and insurers. */
  const exportXlsx=()=>{
    if(typeof XLSX==='undefined'){ alert('The spreadsheet tool is still loading. Try again in a moment.'); return; }
    const data=shown.map(r=>({
      'Employee': r.certSent==='audit'?'':r.employee,
      'Email': r.email||'',
      'Type': r.trainingType||'',
      'Site': r.siteName||'',
      'Date': r.trainingDate||'',
      'Issued': r.certSent==='audit'?'':(r.issueDate||''),
      'Expires': r.expiryDate||'',
      'Status': r.st.label==='-'?'':r.st.label,
      'Trainer / auditor': r.trainer||'',
      'Emailed': r.certSent==='audit'?'':(r.certSent==='yes'?'Yes':'No'),
      'Notes': r.notes||''
    }));
    const ws=XLSX.utils.json_to_sheet(data);
    ws['!cols']=[{wch:26},{wch:28},{wch:22},{wch:28},{wch:12},{wch:12},{wch:12},{wch:14},{wch:20},{wch:9},{wch:40}];
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Register');
    XLSX.writeFile(wb,'IFES_register_'+todayISO()+(siteF?'_'+safeName(siteF):'')+'.xlsx');
  };
  const del=async(r)=>{
    if(!window.confirm('Delete this record for '+r.employee+'?'))return;
    patch.removeTraining(r.id);
    const tk=store.get(SESS).token;
    let rs=null; try{ rs=await api('deleteTraining',{token:tk,id:r.id}); }catch(e){}
    if(!rs||!rs.ok){ alert('Could not delete that record.'); onDelete&&onDelete(); }
  };
  const cards=[['valid','Valid','text-emerald-600'],['soon','Expiring soon (90 days)','text-amber-600'],['expired','Expired','text-red-600']];
  const certN=rows.filter(r=>r.certSent!=='audit').length;
  const auditN=rows.filter(r=>r.certSent==='audit').length;
  const statusSegs=[
    {label:'Valid',value:count('valid'),colour:'#059669'},
    {label:'Expiring soon',value:count('soon'),colour:'#d97706'},
    {label:'Expired',value:count('expired'),colour:'#dc2626'}
  ];
  const activitySegs=[
    {label:'Certificates',value:certN,colour:t.primary},
    {label:'Audits',value:auditN,colour:'#0891b2'}
  ];
  return (
    <div className="space-y-6 fade">
      <h1 className="text-2xl font-bold text-slate-900">Certificate dashboard</h1>
      <div className="grid grid-cols-3 gap-4">
        {cards.map(c=><button key={c[0]} onClick={()=>pickStatus(c[0])} title={status===c[0]?'Show all again':'Show only these in the list below'} className={`text-left bg-white rounded-xl border p-5 shadow-sm transition hover:border-slate-400 ${status===c[0]?'border-slate-500 ring-2 ring-slate-300':'border-slate-200'}`}><p className={`text-3xl font-extrabold ${c[2]}`}>{count(c[0])}</p><p className="text-sm font-medium text-slate-500 mt-1">{c[1]}</p></button>)}
      </div>
      <div className="grid md:grid-cols-2 gap-4">
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <h2 className="font-bold text-slate-800 mb-4">Certificate status</h2>
          <Donut title="Certs" segments={statusSegs} />
        </div>
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <h2 className="font-bold text-slate-800 mb-4">Activity mix</h2>
          <Donut title="Records" segments={activitySegs} />
        </div>
      </div>
      <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
        <div className="p-4 border-b border-slate-100 space-y-3">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <h2 className="font-bold text-slate-800">{filtered?`Showing ${shown.length} of ${rows.length} records`:`All records (${rows.length})`}</h2>
            <div className="flex items-center gap-3">
              {filtered && <button onClick={clearFilters} className="text-xs text-slate-500 underline hover:text-slate-800">Clear filters</button>}
              <button onClick={exportXlsx} disabled={shown.length===0} title="Download what is shown as an Excel file" style={{color:t.primary}} className="flex items-center gap-1.5 text-sm font-semibold border border-slate-300 rounded-lg px-3 py-1.5 hover:bg-slate-50 transition disabled:opacity-50"><I.down size={16}/> Excel</button>
            </div>
          </div>
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
            <input value={filter} onChange={e=>setFilter(e.target.value)} placeholder="Search name, site, notes" className="col-span-2 sm:col-span-1 border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} />
            <select value={kind} onChange={e=>setKind(e.target.value)} className="border border-slate-300 rounded-lg px-2 py-1.5 text-sm bg-white"><option value="all">Certs and audits</option><option value="certs">Certificates only</option><option value="audits">Audits only</option></select>
            <select value={status} onChange={e=>setStatus(e.target.value)} className="border border-slate-300 rounded-lg px-2 py-1.5 text-sm bg-white"><option value="all">Any status</option><option value="valid">Valid</option><option value="soon">Expiring soon</option><option value="expired">Expired</option></select>
            <select value={siteF} onChange={e=>setSiteF(e.target.value)} className="col-span-2 sm:col-span-1 border border-slate-300 rounded-lg px-2 py-1.5 text-sm bg-white"><option value="">All sites</option>{siteOpts.map(s=><option key={s} value={s}>{s}</option>)}</select>
          </div>
        </div>
        <div className="overflow-x-auto"><table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500 text-left border-b border-slate-200"><tr><th className="px-4 py-3 font-semibold">Employee</th><th className="px-4 py-3 font-semibold">Type</th><th className="px-4 py-3 font-semibold">Site</th><th className="px-4 py-3 font-semibold">Trained</th><th className="px-4 py-3 font-semibold">Expires</th><th className="px-4 py-3 font-semibold">Status</th><th className="px-4 py-3"></th></tr></thead>
          <tbody>
            {shown.length===0 && <tr><td colSpan="7" className="px-4 py-8 text-center text-slate-400 italic">{rows.length?'Nothing matches those filters.':'No certificates yet.'}</td></tr>}
            {shown.map(r=>(
              <tr key={r.id} className="border-t border-slate-100 hover:bg-slate-50 transition">
                <td className="px-4 py-3 font-bold text-slate-800">{r.certSent==='audit'?<span className="font-medium text-slate-500 italic" title={r.notes||''}>{r.notes?(String(r.notes).length>60?String(r.notes).slice(0,60)+'...':r.notes):'Site audit'}</span>:r.employee}</td>
                <td className="px-4 py-3 font-medium text-slate-600">{r.trainingType}</td>
                <td className="px-4 py-3 text-slate-600">{r.siteName||<span className="text-slate-300">-</span>}</td>
                <td className="px-4 py-3 text-slate-500">{fmtUK(r.trainingDate)||'-'}</td>
                <td className="px-4 py-3 text-slate-500">{fmtUK(r.expiryDate)||'-'}</td>
                <td className="px-4 py-3"><Badge tone={r.st.tone}>{r.st.label}</Badge></td>
                <td className="px-4 py-3 text-right"><div className="flex items-center justify-end gap-3">{r.certSent==='audit'?null:<button onClick={()=>redl(r)} title="Download certificate" className="text-slate-400 hover:text-slate-700 transition"><I.down size={18}/></button>}{me.role==='admin'||me.role==='superadmin' ? <button onClick={()=>del(r)} className="text-slate-300 hover:text-red-500 transition"><I.trash size={18}/></button> : null}</div></td>
              </tr>
            ))}
          </tbody>
        </table></div>
      </div>
    </div>
  );
}

/* ---------------- Employees (trainees) ---------------- */
function Employees({ t, employees, reload, patch }){
  const [name,setName]=useState(''); const [email,setEmail]=useState('');
  const [msg,setMsg]=useState(null); const [bulkMsg,setBulkMsg]=useState(null); const [busy,setBusy]=useState(false);
  const [q,setQ]=useState(''); const [dupOnly,setDupOnly]=useState(false);
  const norm=(s)=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
  const nameCounts={}; employees.forEach(e=>{ const k=norm(e.name); nameCounts[k]=(nameCounts[k]||0)+1; });
  const dupCount=Object.keys(nameCounts).filter(k=>nameCounts[k]>1).length;

  const add=async(e)=>{ e.preventDefault(); if(!name.trim())return; setBusy(true); setMsg({bad:false,text:'Adding employee...'});
    try{
      const tk=store.get(SESS).token; const r=await api('addEmployee',{token:tk,employee:{name:name.trim(),email:email.trim()}});
      if(r.ok){ setName(''); setEmail(''); setMsg({bad:false,text:'Added.'}); reload(); } else setMsg({bad:true,text:errText(r)});
    }catch(err){ setMsg({bad:true,text:'Could not reach the server.'}); }
    setBusy(false);
  };
  const onFile=async(e)=>{ const f=e.target.files[0]; if(!f)return; setBulkMsg({bad:false,text:'Uploading...'});
    try{ const wb=await readSheetFile(f); const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
      const emps=rows.map(r=>{ const low={}; Object.keys(r).forEach(k=>low[k.toString().trim().toLowerCase()]=r[k]); return {name:String(low.name||'').trim(),email:String(low.email||'').trim()}; }).filter(x=>x.name);
      if(emps.length===0){ setBulkMsg({bad:true,text:'No rows found. Needs columns: name, email.'}); e.target.value=''; return; }
      const tk=store.get(SESS).token; const r=await api('bulkAddEmployees',{token:tk,employees:emps});
      if(r.ok){ setBulkMsg({bad:false,text:`Added ${r.added} employee${r.added===1?'':'s'}.`+(r.skipped?` Skipped ${r.skipped} already on the list (same name and email).`:'')}); reload(); } else setBulkMsg({bad:true,text:errText(r)});
    }catch(err){ setBulkMsg({bad:true,text:'Could not read that file.'}); }
    e.target.value='';
  };
  const del=async(emp)=>{
    if(!window.confirm('Remove '+emp.name+'?'))return;
    patch.removeEmployee(emp.id);
    const tk=store.get(SESS).token;
    const r=await api('deleteEmployee',{token:tk,id:emp.id});
    if(!r||!r.ok){ alert('Could not remove '+emp.name+'.'); reload(); }
  };
  return (
    <div className="space-y-6 fade">
      <h1 className="text-2xl font-bold text-slate-900">Employees</h1>
      <p className="text-slate-600 -mt-4 text-sm">The people who receive training. They do not log in; their certificate is emailed to the address here.</p>
      <div className="grid lg:grid-cols-2 gap-6 items-start">
        <form onSubmit={add} className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div style={{backgroundColor:t.primary}} className="px-5 py-3.5 text-white font-bold flex items-center gap-2"><I.plus size={18}/> Add one</div>
          <div className="p-5 space-y-3">
            <div><label className="block text-xs font-semibold text-slate-600 mb-1">Full name</label><input disabled={busy} value={name} onChange={e=>setName(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} /></div>
            <div><label className="block text-xs font-semibold text-slate-600 mb-1">Email (cert goes here)</label><input disabled={busy} type="email" value={email} onChange={e=>setEmail(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} /></div>
            {msg && <p className={`text-sm font-medium ${msg.bad?'text-red-600':'text-emerald-600'}`}>{msg.text}</p>}
            <button disabled={busy} style={{backgroundColor:t.secondary}} className="w-full text-white font-bold py-2.5 rounded-lg hover:brightness-110 shadow-sm transition disabled:opacity-60">{busy?'Working...':'Add employee'}</button>
          </div>
        </form>
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div style={{backgroundColor:t.primary}} className="px-5 py-3.5 text-white font-bold flex items-center gap-2"><I.up size={18}/> Bulk upload (Excel)</div>
          <div className="p-5 space-y-3 text-sm text-slate-600">
            <p>Spreadsheet with columns: <b>name, email</b>. One row per person.</p>
            <label className="flex items-center justify-center gap-2 border-2 border-dashed border-slate-300 rounded-lg py-8 cursor-pointer hover:border-slate-400 bg-slate-50 hover:bg-slate-100 transition" style={{color:t.primary}}><I.up size={20}/> <span className="font-semibold text-base">Choose .xlsx or .csv</span><input type="file" accept=".xlsx,.xls,.csv" onChange={onFile} className="hidden" /></label>
            {bulkMsg && <p className={`font-medium ${bulkMsg.bad?'text-red-600':'text-emerald-600'}`}>{bulkMsg.text}</p>}
          </div>
        </div>
      </div>
      <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
        <div className="p-4 border-b border-slate-100 flex flex-wrap items-center justify-between gap-3">
          <h2 className="font-bold text-slate-800">All employees ({employees.length})</h2>
          <div className="flex items-center gap-2">
            <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search name or email" className="border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} />
            <button onClick={()=>setDupOnly(v=>!v)} title="Show only names that appear more than once" className={`px-3 py-1.5 rounded-lg text-sm font-semibold border transition ${dupOnly?'text-white border-transparent':'text-slate-600 border-slate-300 hover:bg-slate-50'}`} style={dupOnly?{backgroundColor:t.secondary}:{}}>Duplicates{dupCount?` (${dupCount})`:''}</button>
          </div>
        </div>
        {(() => {
          let list=employees.slice();
          if(q){ const ql=q.toLowerCase(); list=list.filter(e=>String(e.name).toLowerCase().includes(ql)||String(e.email||'').toLowerCase().includes(ql)); }
          if(dupOnly) list=list.filter(e=>nameCounts[norm(e.name)]>1);
          list.sort((a,b)=>String(a.name).localeCompare(String(b.name)));
          if(list.length===0) return <ul className="divide-y divide-slate-100"><li className="p-6 text-slate-400 italic">{dupOnly?'No duplicate names found.':(q?'No matches.':'None yet.')}</li></ul>;
          return (
            <ul className="divide-y divide-slate-100">
              {list.map(e=>{
                const isDup=nameCounts[norm(e.name)]>1;
                return (
                  <li key={e.id} className="px-5 py-3.5 flex items-center justify-between hover:bg-slate-50 transition">
                    <div className="min-w-0">
                      <p className="font-bold text-slate-800 flex items-center gap-2">{e.name} {isDup && <Badge tone="amber">duplicate</Badge>}</p>
                      <p className="text-xs font-medium text-slate-500 mt-0.5">{e.email||'no email'}</p>
                    </div>
                    <button onClick={()=>del(e)} title="Remove employee" className="text-slate-300 hover:text-red-500 transition p-2 shrink-0"><I.trash size={18}/></button>
                  </li>
                );
              })}
            </ul>
          );
        })()}
      </div>
    </div>
  );
}

/* ---------------- Logins (users) ---------------- */
function People({ t, me, users, reload, patch }){
  const canMakeAdmin=me.role==='superadmin';
  const [f,setF]=useState({username:'',name:'',email:'',role:'user',password:genPassword(),qual:''});
  const [msg,setMsg]=useState(null); const [created,setCreated]=useState(null); const [busy,setBusy]=useState(false); const [bulkMsg,setBulkMsg]=useState(null);

  const set=(k,v)=>setF(x=>Object.assign({},x,{[k]:v}));
  const add=async(e)=>{ e.preventDefault(); setMsg({bad:false,text:'Adding login...'}); setCreated(null); setBusy(true);
    let r=null; try{ const tk=store.get(SESS).token; r=await api('addUser',{token:tk,user:f}); }catch(err){ r={ok:false,message:'Could not reach the server.'}; } setBusy(false);
    if(r.ok){ setCreated({username:f.username,password:f.password}); setF({username:'',name:'',email:'',role:'user',password:genPassword(),qual:''}); setMsg(null); reload(); }
    else setMsg({bad:true,text:errText(r)});
  };
  const onFile=async(e)=>{ const file=e.target.files[0]; if(!file)return; setBulkMsg({bad:false,text:'Uploading...'});
    try{ const wb=await readSheetFile(file); const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
      const us=rows.map(r=>{ const low={}; Object.keys(r).forEach(k=>low[k.toString().trim().toLowerCase()]=r[k]);
        return {username:String(low.username||'').trim(),name:String(low.name||low.username||'').trim(),email:String(low.email||'').trim(),role:(String(low.role||'user').trim().toLowerCase()==='admin'&&canMakeAdmin)?'admin':'user',password:String(low.password||'').trim()||genPassword(),qual:String(low.qualification||low.qual||'').trim()}; }).filter(u=>u.username);
      if(us.length===0){ setBulkMsg({bad:true,text:'Needs columns: username, name, email, role, password, qualification.'}); e.target.value=''; return; }
      const tk=store.get(SESS).token; const r=await api('bulkAddUsers',{token:tk,users:us});
      if(r.ok){ setBulkMsg({bad:false,text:`Added ${r.added}, skipped ${r.skipped}.`}); reload(); } else setBulkMsg({bad:true,text:errText(r)});
    }catch(err){ setBulkMsg({bad:true,text:'Could not read that file.'}); } e.target.value='';
  };
  const del=async(u)=>{
    if(!window.confirm('Remove '+u.username+'?'))return;
    patch.removeUser(u.username);
    const tk=store.get(SESS).token;
    let r=null; try{ r=await api('deleteUser',{token:tk,username:u.username}); }catch(e){}
    if(!r||!r.ok){ alert('Could not remove. '+(r?errText(r):'Could not reach the server.')); reload(); }
  };
  /* Matches the server: an admin manages trainers (and edits themselves); only a super admin touches other admins. */
  const canManage=(u)=>canMakeAdmin||u.role==='user';

  const [edit,setEdit]=useState(null);
  const [editBusy,setEditBusy]=useState(false);
  const [editMsg,setEditMsg]=useState(null);
  const openEdit=(u)=>{ setEditMsg(null); setEdit({username:u.username,name:u.name||'',email:u.email||'',qual:u.qual||'',role:u.role}); };
  const saveEdit=async()=>{
    setEditBusy(true); setEditMsg(null);
    const tk=store.get(SESS).token;
    const payload={username:edit.username,name:edit.name,email:edit.email,qual:edit.qual};
    if(canMakeAdmin && edit.role!=='superadmin') payload.role=edit.role;
    let r=null; try{ r=await api('updateUser',{token:tk,user:payload}); }catch(e){ r={ok:false,message:'Could not reach the server.'}; }
    setEditBusy(false);
    if(r&&r.ok){ setEdit(null); reload(); }
    else setEditMsg(errText(r));
  };

  return (
    <div className="space-y-6 fade">
      <h1 className="text-2xl font-bold text-slate-900">Logins</h1>
      <p className="text-slate-600 -mt-4 text-sm">People who sign in: trainers who issue certificates, plus admins. The qualification appears on certificates they issue.</p>
      <div className="grid lg:grid-cols-2 gap-6 items-start">
        <form onSubmit={add} className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div style={{backgroundColor:t.primary}} className="px-5 py-3.5 text-white font-bold flex items-center gap-2"><I.plus size={18}/> Add a login</div>
          <div className="p-5 space-y-3">
            <div className="grid sm:grid-cols-2 gap-3"><div><label className="block text-xs font-semibold text-slate-600 mb-1">Username</label><input disabled={busy} required value={f.username} onChange={e=>set('username',e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} /></div><div><label className="block text-xs font-semibold text-slate-600 mb-1">Full name</label><input disabled={busy} value={f.name} onChange={e=>set('name',e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} /></div></div>
            <div><label className="block text-xs font-semibold text-slate-600 mb-1">Email</label><input disabled={busy} type="email" value={f.email} onChange={e=>set('email',e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} /></div>
            <div><label className="block text-xs font-semibold text-slate-600 mb-1">Qualification (shows on certs they issue, e.g. QQI Level 6)</label><input disabled={busy} value={f.qual} onChange={e=>set('qual',e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} /></div>
            <div className="grid sm:grid-cols-2 gap-3">
              <div><label className="block text-xs font-semibold text-slate-600 mb-1">Access</label><select disabled={busy} value={f.role} onChange={e=>set('role',e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}}><option value="user">Trainer</option>{canMakeAdmin && <option value="admin">Admin</option>}</select></div>
              <div><label className="block text-xs font-semibold text-slate-600 mb-1">Password</label><div className="flex gap-2"><input disabled={busy} value={f.password} onChange={e=>set('password',e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 font-mono text-sm focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} /><button disabled={busy} type="button" onClick={()=>set('password',genPassword())} className="text-xs font-semibold text-slate-500 border border-slate-300 rounded-lg px-3 hover:bg-slate-50 transition">New</button></div></div>
            </div>
            {msg && <p className={`text-sm font-medium ${msg.bad?'text-red-600':'text-emerald-600'}`}>{msg.text}</p>}
            {created && <div className="bg-emerald-50 border border-emerald-200 rounded-lg p-3 text-sm"><p className="font-bold text-emerald-800 flex items-center gap-1.5"><I.check size={16}/> Created. Give them:</p><p className="mt-1.5 font-mono text-slate-700">Username: {created.username}<br/>Password: {created.password}</p></div>}
            <button disabled={busy} style={{backgroundColor:t.secondary}} className="w-full text-white font-bold py-2.5 rounded-lg hover:brightness-110 shadow-sm transition disabled:opacity-60">{busy?'Working...':'Add login'}</button>
          </div>
        </form>
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div style={{backgroundColor:t.primary}} className="px-5 py-3.5 text-white font-bold flex items-center gap-2"><I.up size={18}/> Bulk upload (Excel)</div>
          <div className="p-5 space-y-3 text-sm text-slate-600"><p>Columns: <b>username, name, email, role, password, qualification</b>. Blank passwords are generated. {canMakeAdmin?'Role admin is allowed.':'All added as trainers.'}</p>
            <label className="flex items-center justify-center gap-2 border-2 border-dashed border-slate-300 rounded-lg py-8 cursor-pointer hover:border-slate-400 bg-slate-50 hover:bg-slate-100 transition" style={{color:t.primary}}><I.up size={20}/> <span className="font-semibold text-base">Choose .xlsx or .csv</span><input type="file" accept=".xlsx,.xls,.csv" onChange={onFile} className="hidden" /></label>
            {bulkMsg && <p className={`font-medium ${bulkMsg.bad?'text-red-600':'text-emerald-600'}`}>{bulkMsg.text}</p>}
          </div>
        </div>
      </div>
      <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
        <div className="p-4 border-b border-slate-100"><h2 className="font-bold text-slate-800">All logins ({users.length})</h2></div>
        <div className="overflow-x-auto"><table className="w-full text-sm"><thead className="bg-slate-50 text-slate-500 text-left border-b border-slate-200"><tr><th className="px-4 py-3 font-semibold">Name</th><th className="px-4 py-3 font-semibold">Username</th><th className="px-4 py-3 font-semibold">Email</th><th className="px-4 py-3 font-semibold">Qualification</th><th className="px-4 py-3 font-semibold">Access</th><th className="px-4 py-3"></th></tr></thead>
          <tbody>{users.map(u=><tr key={u.username} className="border-t border-slate-100 hover:bg-slate-50 transition"><td className="px-4 py-3 font-bold text-slate-800">{u.name}</td><td className="px-4 py-3 text-slate-600 font-mono text-xs">{u.username}</td><td className="px-4 py-3 text-slate-600">{u.email||'-'}</td><td className="px-4 py-3 text-slate-600">{u.qual||<span className="text-amber-600 font-medium">not set</span>}</td><td className="px-4 py-3"><Badge tone={u.role==='superadmin'?'blue':u.role==='admin'?'green':'slate'}>{roleLabel(u.role)}</Badge></td><td className="px-4 py-3 text-right"><div className="flex items-center justify-end gap-2">{(canManage(u)||u.username===me.username) && <button onClick={()=>openEdit(u)} title="Edit login" className="text-slate-300 hover:text-sky-600 transition p-1"><I.pencil size={17}/></button>}{u.username!==me.username && canManage(u) && <button onClick={()=>del(u)} title="Remove login" className="text-slate-300 hover:text-red-500 transition p-1"><I.trash size={18}/></button>}</div></td></tr>)}</tbody>
        </table></div>
      </div>
      {edit && (
        <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50 fade" onClick={()=>!editBusy&&setEdit(null)}>
          <div onClick={e=>e.stopPropagation()} className="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden">
            <div style={{backgroundColor:t.primary}} className="px-6 py-4 text-white font-bold flex items-center gap-2"><I.pencil size={18}/> Edit {edit.username}</div>
            <div className="p-6 space-y-3">
              <div><label className="block text-xs font-semibold text-slate-600 mb-1">Full name</label><input disabled={editBusy} value={edit.name} onChange={e=>setEdit(x=>Object.assign({},x,{name:e.target.value}))} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} /></div>
              <div><label className="block text-xs font-semibold text-slate-600 mb-1">Email</label><input disabled={editBusy} type="email" value={edit.email} onChange={e=>setEdit(x=>Object.assign({},x,{email:e.target.value}))} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} /></div>
              <div><label className="block text-xs font-semibold text-slate-600 mb-1">Qualification (shows on certs they issue)</label><input disabled={editBusy} value={edit.qual} onChange={e=>setEdit(x=>Object.assign({},x,{qual:e.target.value}))} placeholder="e.g. QQI Level 6" className="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} /></div>
              {canMakeAdmin && edit.role!=='superadmin' && <div><label className="block text-xs font-semibold text-slate-600 mb-1">Access</label><select disabled={editBusy} value={edit.role} onChange={e=>setEdit(x=>Object.assign({},x,{role:e.target.value}))} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}}><option value="user">Trainer</option><option value="admin">Admin</option></select></div>}
              <p className="text-xs text-slate-400">To change a password, the person uses the Password button after signing in.</p>
              {editMsg && <p className="text-sm text-red-600 font-medium">{editMsg}</p>}
              <div className="flex gap-3 pt-1"><button disabled={editBusy} onClick={()=>setEdit(null)} className="flex-1 border border-slate-300 rounded-lg py-2.5 text-slate-600 font-semibold hover:bg-slate-50 transition disabled:opacity-60">Cancel</button><button disabled={editBusy} onClick={saveEdit} style={{backgroundColor:t.secondary}} className="flex-1 text-white font-bold py-2.5 rounded-lg hover:brightness-110 shadow-sm transition disabled:opacity-60">{editBusy?'Saving...':'Save'}</button></div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------- Change password ---------------- */
function ChangePassword({ t, onClose }){
  const [cur,setCur]=useState(''); const [nw,setNw]=useState(''); const [cf,setCf]=useState(''); const [msg,setMsg]=useState(null); const [busy,setBusy]=useState(false);
  const submit=async(e)=>{ e.preventDefault(); setMsg(null);
    if(nw.length<6){ setMsg({bad:true,text:'New password must be at least 6 characters.'}); return; }
    if(nw!==cf){ setMsg({bad:true,text:'The new passwords do not match.'}); return; }
    setBusy(true); setMsg({bad:false,text:'Saving...'});
    try{ const tk=store.get(SESS).token; const r=await api('changePassword',{token:tk,currentPassword:cur,newPassword:nw}); setBusy(false);
      if(r.ok){ setMsg({bad:false,text:'Password changed.'}); setCur('');setNw('');setCf(''); }
      else if(r.error==='bad_current') setMsg({bad:true,text:'Current password is wrong.'});
      else setMsg({bad:true,text:'Could not change password.'});
    }catch(e){ setBusy(false); setMsg({bad:true,text:'Could not reach the server.'}); }
  };
  return (
    <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50 fade" onClick={onClose}>
      <form onClick={e=>e.stopPropagation()} onSubmit={submit} className="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden">
        <div style={{backgroundColor:t.primary}} className="px-6 py-4 text-white font-bold flex items-center gap-2"><I.lock size={18}/> Change password</div>
        <div className="p-6 space-y-3">
          <input disabled={busy} type="password" placeholder="Current password" value={cur} onChange={e=>setCur(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} />
          <input disabled={busy} type="password" placeholder="New password" value={nw} onChange={e=>setNw(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} />
          <input disabled={busy} type="password" placeholder="Confirm new password" value={cf} onChange={e=>setCf(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} />
          {msg && <p className={`text-sm font-medium ${msg.bad?'text-red-600':'text-emerald-600'}`}>{msg.text}</p>}
          <div className="flex gap-3 pt-2"><button disabled={busy} type="button" onClick={onClose} className="flex-1 border border-slate-300 rounded-lg py-2.5 text-slate-600 font-semibold hover:bg-slate-50 transition disabled:opacity-60">Close</button><button disabled={busy} style={{backgroundColor:t.secondary}} className="flex-1 text-white font-bold py-2.5 rounded-lg hover:brightness-110 shadow-sm transition disabled:opacity-60">{busy?'Working...':'Save'}</button></div>
        </div>
      </form>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
(function(){
  try{
    var src=document.getElementById('appsrc').textContent;
    var out=Babel.transform(src,{presets:[['react',{runtime:'classic',pragma:'React.createElement',pragmaFrag:'React.Fragment'}]]}).code;
    (0,eval)(out);
  }catch(err){
    var root=document.getElementById('root');
    if(root) root.innerHTML='<pre style="padding:20px;color:#b00020;white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,monospace">Startup error:\n\n'+((err&&err.message)||err)+'</pre>';
    throw err;
  }
})();
</script>
</body>
</html>
