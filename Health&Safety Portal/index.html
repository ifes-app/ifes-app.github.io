<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IFES Health &amp; Safety Portal</title>
<link rel="icon" href="https://www.tsg-solutions.com/wp-content/uploads/2026/01/ifes-logo-v3-204x300-1.webp" />

<!-- Libraries are pinned to exact versions so a new release can never change the app
     overnight, and the integrity hash makes the browser refuse a tampered file.
     Tailwind's CDN sends no CORS header, so it can be pinned but not hash-checked.
     SheetJS 0.20.3 comes from its own CDN: npm stops at 0.18.5, which has two known
     flaws in reading crafted spreadsheets. The last three are only needed on a click,
     so they load in the background and a slow host cannot hold up the sign-in screen. -->
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.9/babel.min.js" integrity="sha384-oLbIC13I/8DNBviftYPfOFQS5DC2WUmwk0SyIPmnzu1Ui+vYyATSSBJiJ5ETa4o/" crossorigin="anonymous"></script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script defer src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" integrity="sha384-EnyY0/GSHQGSxSgMwaIPzSESbqoOLSexfnSMN2AP+39Ckmn92stwABZynq1JyzdT" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/pizzip@3.1.7/dist/pizzip.min.js" integrity="sha384-3mvYicTS7UKJFuQYjm4TLHd0AEsGqivIvpOz05D1WC6EY0wjrdMXxlwRAdckMW73" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/docxtemplater@3.50.0/build/docxtemplater.js" integrity="sha384-iE2CLpzI//WSW27IS4DPW3L3BJaOxn0tcasTXUDBWsyWw35ruWTPz6ERH7FP14Zg" crossorigin="anonymous"></script>
<style>@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.fade{animation:fade .25s ease-out}</style>
</head>
<body>
<div id="root"></div>

<script>
window.addEventListener('error', function(e){
  var r=document.getElementById('root');
  if(r && !r.hasChildNodes()){ r.innerHTML='<pre style="padding:20px;color:#b00020;white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,monospace">Startup error:\n\n'+((e&&(e.message||e.error))||'unknown')+'\n\nOpen the console (F12) for detail.</pre>'; }
});
</script>

<script type="text/plain" id="appsrc">
/* eslint-disable */
const { useState, useEffect, useRef } = React;

/* ===== CONFIG 2 ===== */
const CONFIG = {
  BACKEND_PREFIX: "https://script.google.com/macros/s/AKfycbz51Kg6kdeyAMvQ3d79NlVlqRGyTl-9jbWrDMYLzv3G7Je3CemcG0WGqX",
  LOGO_URL: "https://www.tsg-solutions.com/wp-content/uploads/2026/01/ifes-logo-v3-204x300-1.webp",
  CERT_FILE: "Cert.txt",
  /* Training fallback if sheet is empty. */
  TRAINING_TYPES: [ {id: "Manual Handling", name: "Manual Handling", duration: 36} ],
  /* Fallback instructor if a trainer has no qualification saved. */
  INSTRUCTOR: { name: "Cormac Farrell", title: "Manual Handling Instructor", qual: "QQI Level 6" },
  /* Site list fallback, only used until the backend sends its Sites sheet. */
  DEFAULT_SITES: ['Marymount Bedrooms','OPW Ballincollig Garda station','The Railway','MUH Endoscopy','MUH St Claires MMD','Heather House 1st floor','Hanover Street','MUH St Michaels','Cian Small jobs','Boston CNC','Boston Decarb 2026','Heineken']
};
const THEME = { primary:'#005C9C', secondary:'#0077C8', lightBg:'#F1F6FA' };

const store = {
  get(k){ try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;} },
  set(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} },
  del(k){ try{localStorage.removeItem(k);}catch(e){} }
};
const SESS='ifes_session';
const BOOT_CACHE='ifes_boot_cache';
let BACKEND_CODE=(function(){ try{return JSON.parse(localStorage.getItem('backend_code'))||'';}catch(e){return '';} })();
const backendReady=()=>BACKEND_CODE.length>0;
const backendUrl=()=>CONFIG.BACKEND_PREFIX+BACKEND_CODE+"/exec";

const todayISO = () => {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
};

const addMonths = (iso, m) => {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  d.setMonth(d.getMonth() + parseInt(m));
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
};

const fmtUK=(iso)=>{ if(!iso)return ''; const d=new Date(iso); if(isNaN(d))return String(iso); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); };

const daysUntil=(iso)=>{ if(!iso)return null; return Math.ceil((new Date(iso)-new Date())/86400000); };

/* Turn a duration in months into wording for the certificate: 12 -> "1 year",
   36 -> "3 years", 18 -> "18 months", 6 -> "6 months". */
const validForText=(months)=>{
  const m=parseInt(months); if(!m||m<1) return '';
  if(m%12===0){ const y=m/12; return y+(y===1?' year':' years'); }
  return m+(m===1?' month':' months');
};
const monthsBetween=(fromIso,toIso)=>{
  const a=new Date(fromIso), b=new Date(toIso);
  if(isNaN(a)||isNaN(b)) return 0;
  return (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth());
};
/* Passwords come from the browser's secure random source, not Math.random. */
const genPassword=()=>{ const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'; const r=new Uint32Array(10); crypto.getRandomValues(r); let s=''; for(let i=0;i<10;i++)s+=c[r[i]%c.length]; return s; };
const safeName=(n)=>String(n).replace(/[^A-Za-z0-9]+/g,'_');

/* Sites: shown A-Z so the list stays easy to scan as it grows. canonSite turns
   "heineken" typed by hand into "Heineken" from the list, so one site is never
   recorded under two spellings. */
const sortSites=(list)=>(list||[]).map(s=>String(s).trim()).filter(Boolean).sort((a,b)=>a.localeCompare(b,'en',{sensitivity:'base'}));
const findSite=(sites,v)=>{ const k=String(v||'').trim().toLowerCase(); return k?(sites||[]).find(s=>s.toLowerCase()===k):undefined; };
const canonSite=(sites,v)=>findSite(sites,v)||String(v||'').trim();
/* Records from before the Site column hold an audit's site as "Site: X" in the employee column. */
const rowSite=(r)=>r.site||(r.certSent==='audit'&&/^Site: /.test(String(r.employee||''))?String(r.employee).slice(6):'');

/* Courses come from the sheet as {name, duration}. Normalise them so the
   name doubles as a stable id, and flag any course whose name contains
   the word audit as a no-certificate audit type. */
const normCourses=(list)=>(list||[]).map(c=>({
  id:String(c.name), name:c.name, duration:c.duration, audit:/audit/i.test(String(c.name))
}));

function errText(r){
  if(!r) return 'No reply from the server.';
  if(r.error==='unknown_action') return 'Your backend is running an OLD version. In Apps Script: Deploy > Manage deployments > pencil > Version: New version > Deploy.';
  if(r.error==='auth') return 'Your session expired. Log out and back in.';
  if(r.error==='forbidden') return 'Your login does not have permission for that.';
  if(r.error==='exists') return r.message||'That one already exists.';
  if(r.error==='no_qual') return 'Your login has no qualification saved, so you cannot issue certificates. Ask an admin to add it on the Logins tab.';
  if(r.error==='system_busy') return r.message;
  if(r.error==='forbidden_role') return 'Your login cannot give that level of access.';
  if(r.message) return r.message;
  return 'Server said: '+(r.error||'unknown error');
}
async function api(action,payload){
  let res;
  try{ res=await fetch(backendUrl(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},payload))}); }
  catch(e){ throw {code:'network'}; }
  try{ return await res.json(); }catch(e){ throw {code:'bad_endpoint'}; }
}

const CERT_CACHE={};
async function loadCert(file){
  if(CERT_CACHE[file]) return CERT_CACHE[file];
  const r=await fetch(file);
  if(!r.ok) throw {message:'Could not load '+file+' (make sure it sits next to index.html on the host).'};
  CERT_CACHE[file]=(await r.text()).replace(/\s+/g,'');
  return CERT_CACHE[file];
}
function buildCertBytes(b64,data){
  const bin=atob(b64); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  const zip=new PizZip(bytes);
  const Docx=(window.docxtemplater&&window.docxtemplater.default)?window.docxtemplater.default:window.docxtemplater;
  const doc=new Docx(zip,{paragraphLoop:true,linebreaks:true});
  const validFor = data.validFor || validForText(data.durationMonths) || validForText(monthsBetween(data.trainingDate,data.expiryDate)) || '';
  doc.render({
    employeeName:data.name,
    trainingType:data.trainingType||'',
    trainingTypeLower:(data.trainingType||'').toLowerCase(),
    trainingDate:fmtUK(data.trainingDate),
    issueDate:fmtUK(data.issueDate),
    expiryDate:fmtUK(data.expiryDate),
    validFor:validFor,
    instructorName:data.instructorName,
    instructorTitle:data.instructorTitle,
    instructorQual:data.instructorQual
  });
  return doc.getZip().generate({type:'uint8array'});
}
/* A CSV carries no note of its encoding. Excel on Windows saves "CSV" as Windows-1252,
   most other tools save UTF-8, and reading one as the other turns Siobhán into
   SiobhÃ¡n. Try strict UTF-8 first and fall back to Windows-1252. .xlsx is unaffected. */
async function readSheetFile(f){
  const buf=await f.arrayBuffer();
  if(/\.(csv|txt)$/i.test(f.name||'')||/csv/i.test(f.type||'')){
    let text; try{ text=new TextDecoder('utf-8',{fatal:true}).decode(buf); }catch(e){ text=new TextDecoder('windows-1252').decode(buf); }
    return XLSX.read(text.replace(/^\uFEFF/,''),{type:'string'});
  }
  return XLSX.read(buf);
}
function uint8ToBase64(u8){ let s=''; const chunk=0x8000; for(let i=0;i<u8.length;i+=chunk){ s+=String.fromCharCode.apply(null,u8.subarray(i,i+chunk)); } return btoa(s); }
function downloadBlob(blob,filename){ const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1500); }
const DOCX_MIME='application/vnd.openxmlformats-officedocument.wordprocessingml.document';

const I={
  cal:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>,
  grid:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>,
  cert:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="4" y="4" width="16" height="12" rx="1"/><circle cx="12" cy="18" r="2.5"/><path d="M10.5 20L9 23l3-1.5L15 23l-1.5-3"/></svg>,
  users:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.3 3-5 6.5-5s6.5 1.7 6.5 5"/><path d="M17 5a3 3 0 010 6M18 20c0-2.2-1-3.7-2.5-4.6"/></svg>,
  user:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>,
  plus:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 5v14M5 12h14"/></svg>,
  up:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 20h16"/></svg>,
  down:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>,
  out:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>,
  trash:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>,
  lock:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>,
  check:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 6L9 17l-5-5"/></svg>,
  pencil:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>,
  clip:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4a3 3 0 016 0"/><path d="M9 11l2 2 4-4"/></svg>,
  left:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M15 18l-6-6 6-6"/></svg>,
  right:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 18l6-6-6-6"/></svg>
};
const roleLabel=(r)=> r==='superadmin'?'Super admin':r==='admin'?'Admin':'Trainer';
const Badge=({children,tone})=>{ const m={green:'bg-emerald-100 text-emerald-700',amber:'bg-amber-100 text-amber-700',red:'bg-red-100 text-red-700',slate:'bg-slate-100 text-slate-600',blue:'bg-sky-100 text-sky-700'}; return <span className={`text-xs font-semibold px-2 py-0.5 rounded-full ${m[tone]||m.slate}`}>{children}</span>; };
const Logo=({className})=> <img src={CONFIG.LOGO_URL} alt="IFES" className={className} onError={(e)=>{e.target.style.display='none';}} />;

/* ===================== APP ===================== */
function App(){
  const t=THEME;
  const [ready,setReady]=useState(false);
  const [me,setMe]=useState(null);
  const [tab,setTab]=useState('give');
  const [users,setUsers]=useState([]);
  const [employees,setEmployees]=useState([]);
  const [training,setTraining]=useState([]);
  const [courses,setCourses]=useState([]);
  const [schedule,setSchedule]=useState([]);
  const [sites,setSitesState]=useState(sortSites(CONFIG.DEFAULT_SITES));
  const [mailQuota,setMailQuota]=useState(null);
  const [showPw,setShowPw]=useState(false);
  const skipNextLoad=useRef(false);
  const isAdmin=me&&(me.role==='admin'||me.role==='superadmin');

  /* The site list changes on its own (add/remove, or a typed site saved while booking),
     so keep the startup cache in step without waiting for a full reload. */
  const setSites=(list)=>{
    const s=sortSites(list); setSitesState(s);
    const c=store.get(BOOT_CACHE); if(c){ c.sites=s; store.set(BOOT_CACHE,c); }
  };

  /* Apply a bootstrap payload to state and cache it for instant startup next time.
     An older backend sends no sites, so the built-in list stands in. */
  const applyBoot=(r)=>{
    setEmployees(r.employees||[]); setTraining(r.training||[]);
    setCourses(normCourses(r.courses||[])); setSchedule(r.schedule||[]);
    if(r.users)setUsers(r.users);
    const s=sortSites(r.sites||CONFIG.DEFAULT_SITES); setSitesState(s);
    setMailQuota(typeof r.mailQuota==='number'?r.mailQuota:null);
    store.set(BOOT_CACHE,{employees:r.employees||[],training:r.training||[],courses:r.courses||[],schedule:r.schedule||[],users:r.users||null,sites:s});
  };

  useEffect(()=>{ (async()=>{
    const sess=store.get(SESS);
    if(sess&&sess.token&&sess.me&&backendReady()){
      /* Show the last known data instantly, then refresh in the background. */
      const cache=store.get(BOOT_CACHE);
      if(cache){
        setEmployees(cache.employees||[]); setTraining(cache.training||[]);
        setCourses(normCourses(cache.courses||[])); setSchedule(cache.schedule||[]);
        if(cache.users)setUsers(cache.users);
        if(cache.sites)setSitesState(sortSites(cache.sites));
      }
      setMe(Object.assign({token:sess.token},sess.me));
    }
    setReady(true);
  })(); },[]);

  const [loadErr,setLoadErr]=useState('');
  const loadData=async()=>{
    const tk=me&&me.token; if(!tk)return;
    try{
      const r=await api('bootstrap',{token:tk});
      if(r.ok){
        applyBoot(r);
        if(r.qual!==undefined && r.qual!==me.qual){ const upd=Object.assign({},me,{qual:r.qual}); setMe(upd); store.set(SESS,{token:upd.token,me:{username:upd.username,name:upd.name,role:upd.role,qual:upd.qual}}); }
        setLoadErr('');
      }
      else setLoadErr(errText(r));
    }catch(e){ setLoadErr('Could not reach the server.'); }
  };

  const meToken = me ? me.token : null;
  useEffect(()=>{ if(me){ setTab(isAdmin?'dashboard':'give'); if(skipNextLoad.current){ skipNextLoad.current=false; } else loadData(); } },[meToken]);

  const onLogin=(d)=>{
    store.set(SESS,{token:d.token,me:{username:d.username,name:d.name,role:d.role,qual:d.qual||''}});
    if(d.data){ applyBoot(d.data); skipNextLoad.current=true; }
    setMe({token:d.token,username:d.username,name:d.name,role:d.role,qual:d.qual||''});
  };
  /* Tell the server too, so the session cannot be reused from this device's storage. */
  const logout=()=>{ const tk=me&&me.token; if(tk) api('logout',{token:tk}).catch(()=>{}); store.del(SESS); store.del(BOOT_CACHE); setMe(null); setUsers([]); setEmployees([]); setTraining([]); setSchedule([]); };

  /* Optimistic local updates: rows disappear instantly, server confirms in the background. */
  const patch={
    removeEmployee:(id)=>setEmployees(l=>l.filter(x=>x.id!==id)),
    removeUser:(un)=>setUsers(l=>l.filter(x=>x.username!==un)),
    removeTraining:(id)=>setTraining(l=>l.filter(x=>x.id!==id)),
    removeSchedule:(id)=>setSchedule(l=>l.filter(x=>x.id!==id))
  };

  if(!ready) return <div className="min-h-screen flex items-center justify-center text-slate-400">Loading...</div>;
  if(!me) return <Login t={t} onLogin={onLogin} />;

  const NavBtn=({id,icon,label})=>(
    <button onClick={()=>setTab(id)} style={{backgroundColor:tab===id?t.secondary:'transparent'}}
      className={`flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium transition ${tab===id?'text-white shadow-sm':'text-white/80 hover:bg-white/10'}`}>{icon}<span className="hidden sm:inline">{label}</span></button>
  );

  return (
    <div className="min-h-screen" style={{backgroundColor:t.lightBg}}>
      <header className="bg-white border-b border-slate-200 shadow-sm">
        <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
          <div className="flex items-center gap-3"><Logo className="h-10 object-contain" /><span className="text-slate-400 font-medium text-sm hidden sm:inline">H&amp;S Portal</span></div>
          <div className="flex items-center gap-3">
            <span className="hidden sm:flex items-center gap-2 text-sm text-slate-600"><I.user size={16}/> {me.name} <Badge tone="blue">{roleLabel(me.role)}</Badge></span>
            <button onClick={()=>setShowPw(true)} className="flex items-center gap-1 text-slate-500 hover:text-slate-800 text-sm font-medium"><I.lock size={16}/><span className="hidden sm:inline">Password</span></button>
            <button onClick={logout} className="flex items-center gap-1 text-slate-500 hover:text-slate-800 text-sm font-medium"><I.out size={16}/><span className="hidden sm:inline">Log out</span></button>
          </div>
        </div>
      </header>
      <nav style={{backgroundColor:t.primary}} className="text-white shadow">
        <div className="max-w-6xl mx-auto px-4 flex gap-2 h-12 items-center">
          {isAdmin && <NavBtn id="dashboard" icon={<I.grid size={17}/>} label="Dashboard" />}
          <NavBtn id="give" icon={<I.cert size={17}/>} label="Give training" />
          {isAdmin && <NavBtn id="schedule" icon={<I.cal size={17}/>} label="Plan Schedule" />}
          {isAdmin && <NavBtn id="employees" icon={<I.users size={17}/>} label="Employees" />}
          {isAdmin && <NavBtn id="people" icon={<I.user size={17}/>} label="Logins" />}
          <a href="schedule.html" target="_blank" rel="noopener" className="flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium text-white/80 hover:bg-white/10 transition ml-auto" title="Open the full read-only schedule (agenda, month and year views)"><I.cal size={17}/><span className="hidden sm:inline">Schedule board</span></a>
        </div>
      </nav>
      <main className="max-w-6xl mx-auto px-4 py-8">
        {loadErr && <div className="mb-6 bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 text-sm font-medium">{loadErr}</div>}
        {tab==='dashboard' && isAdmin && <Dashboard t={t} training={training} sites={sites} onDelete={loadData} patch={patch} me={me} />}
        {tab==='give' && <GiveTraining t={t} me={me} employees={employees} courses={courses} schedule={schedule} sites={sites} setSites={setSites} mailQuota={mailQuota} isAdmin={isAdmin} onIssued={loadData} reloadCourses={loadData} />}
        {tab==='schedule' && isAdmin && <Schedule t={t} courses={courses} schedule={schedule} users={users} sites={sites} setSites={setSites} reload={loadData} patch={patch} />}
        {tab==='employees' && isAdmin && <Employees t={t} employees={employees} reload={loadData} patch={patch} />}
        {tab==='people' && isAdmin && <People t={t} me={me} users={users} reload={loadData} patch={patch} />}
      </main>
      {showPw && <ChangePassword t={t} onClose={()=>setShowPw(false)} />}
    </div>
  );
}

/* ---------------- Login ---------------- */
function Login({ t, onLogin }){
  const [username,setU]=useState(''); const [password,setP]=useState(''); const [code,setCode]=useState('');
  const [needCode,setNeedCode]=useState(!backendReady()); const [err,setErr]=useState(''); const [busy,setBusy]=useState(false);
  const submit=async(e)=>{ e.preventDefault(); setErr(''); setBusy(true);
    try{
      if(CONFIG.BACKEND_PREFIX.indexOf('http')!==0){ setErr('Backend not set up in the app yet.'); setBusy(false); return; }
      if(needCode){ if(!code.trim()){ setErr('Enter your access code.'); setBusy(false); return; } BACKEND_CODE=code.trim(); }
      const r=await api('login',{username:username.trim(),password});
      if(r.ok){ store.set('backend_code',BACKEND_CODE); onLogin({username:r.username,name:r.name,role:r.role,qual:r.qual||'',token:r.token,data:r.data||null}); }
      else setErr(r.error==='locked'?r.message:'Wrong username or password.');
    }catch(e){ if(e&&e.code==='bad_endpoint'){ setErr('That access code does not match. Check the last 12 characters.'); if(needCode)BACKEND_CODE=''; } else setErr('Could not reach the server. Check your internet connection.'); }
    finally{ setBusy(false); }
  };

  const hardReset = () => { localStorage.clear(); window.location.reload(); };

  return (
    <div className="min-h-screen flex items-center justify-center p-4" style={{backgroundColor:t.lightBg}}>
      <form onSubmit={submit} className="w-full max-w-sm bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden fade">
        <div className="px-8 py-8 text-center border-b border-slate-100"><Logo className="h-16 mx-auto object-contain" /><p className="text-slate-500 text-sm mt-3 font-medium">Health &amp; Safety Portal</p></div>
        <div className="p-8 space-y-4">
          {needCode && <div><label className="block text-sm font-semibold text-slate-700 mb-1">Access code <span className="font-normal text-slate-400">(first time here)</span></label><input value={code} onChange={e=>setCode(e.target.value)} placeholder="12-character code" className="w-full border border-slate-300 rounded-lg px-3 py-2.5 font-mono focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} /></div>}
          <div><label className="block text-sm font-semibold text-slate-700 mb-1">Username</label><input autoFocus value={username} onChange={e=>setU(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} /></div>
          <div><label className="block text-sm font-semibold text-slate-700 mb-1">Password</label><input type="password" value={password} onChange={e=>setP(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} /></div>
          {err && <p className="text-sm text-red-600 font-medium">{err}</p>}

          <div className="flex justify-between items-center">
            {!needCode && <button type="button" onClick={()=>setNeedCode(true)} className="text-xs text-slate-400 underline hover:text-slate-600">Change access code</button>}
            <button type="button" onClick={hardReset} className="text-xs text-red-400 underline hover:text-red-600">Reset App Connection</button>
          </div>

          <button disabled={busy} style={{backgroundColor:t.secondary}} className="w-full text-white font-bold py-2.5 rounded-lg hover:brightness-95 transition disabled:opacity-60">{busy?'Signing in...':'Sign in'}</button>
        </div>
      </form>
    </div>
  );
}

/* ---------------- Site picker ---------------- */
/* The saved site list, plus "Other" to type one in. An admin typing a new site
   can keep it on the list so nobody has to type it twice. A site that arrives
   from outside (a booked session being run) selects itself, or opens Other with
   the name filled in if it is not on the list. */
const OTHER_SITE='__other__';
function SitePicker({ t, sites, value, onChange, required, canSave, save, onSave, disabled }){
  const typed=useRef(null);
  const [other,setOther]=useState(()=>!!String(value||'').trim()&&!findSite(sites,value));
  useEffect(()=>{
    if(value===typed.current) return;          // our own keystroke: leave the mode alone
    const m=findSite(sites,value);
    if(m){ setOther(false); if(m!==value) onChange(m); }
    else setOther(!!String(value||'').trim());
  },[value,sites.join('|')]);
  const pick=(v)=>{
    if(v===OTHER_SITE){ typed.current=''; setOther(true); onChange(''); }
    else { typed.current=null; setOther(false); onChange(v); }
  };
  const type=(v)=>{ typed.current=v; onChange(v); };
  const onList=findSite(sites,value);
  const cls="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:outline-none";
  return (
    <div>
      <label className="block text-xs font-semibold text-slate-600 mb-1">Site / Location{!required && <span className="font-normal text-slate-400"> (optional)</span>}</label>
      <select disabled={disabled} value={other?OTHER_SITE:(onList||'')} onChange={e=>pick(e.target.value)} className={cls} style={{'--tw-ring-color':t.primary}}>
        <option value="">{required?'Choose a site...':'No site'}</option>
        {sites.map(s=><option key={s} value={s}>{s}</option>)}
        <option value={OTHER_SITE}>Other (type it in)</option>
      </select>
      {other && <input disabled={disabled} autoFocus value={value} onChange={e=>type(e.target.value)} maxLength={120} placeholder="Type the site name" className={cls+' mt-2'} style={{'--tw-ring-color':t.primary}} />}
      {other && onList && <p className="text-xs text-slate-500 mt-1">Already on the list as <b>{onList}</b>, and will be saved under that name.</p>}
      {other && canSave && String(value||'').trim() && !onList && (
        <label className="mt-2 flex items-center gap-2 text-xs text-slate-600 cursor-pointer select-none">
          <input type="checkbox" checked={!!save} onChange={e=>onSave(e.target.checked)} className="w-4 h-4" /> Add to the site list for next time
        </label>
      )}
    </div>
  );
}

/* Admin list of sites: add one, or remove one with its x. */
function SiteManager({ t, sites, setSites }){
  const [name,setName]=useState(''); const [busy,setBusy]=useState(false); const [delBusy,setDelBusy]=useState(null); const [msg,setMsg]=useState(null);
  const add=async()=>{
    const n=name.trim(); if(!n){ setMsg({bad:true,text:'Type a site name.'}); return; }
    if(findSite(sites,n)){ setMsg({bad:true,text:'That site is already on the list.'}); return; }
    setBusy(true); setMsg(null);
    try{ const r=await api('addSite',{token:store.get(SESS).token,name:n});
      if(r.ok){ setSites(r.sites||sites.concat([n])); setName(''); setMsg({bad:false,text:'Site added.'}); } else setMsg({bad:true,text:errText(r)});
    }catch(e){ setMsg({bad:true,text:'Could not reach the server.'}); }
    setBusy(false);
  };
  const del=async(s)=>{
    if(!window.confirm('Take "'+s+'" off the site list?\n\nBookings and records that already use it are not changed.'))return;
    setDelBusy(s); setMsg(null);
    try{ const r=await api('deleteSite',{token:store.get(SESS).token,name:s});
      if(r.ok){ setSites(r.sites||sites.filter(x=>x!==s)); } else setMsg({bad:true,text:errText(r)});
    }catch(e){ setMsg({bad:true,text:'Could not reach the server.'}); }
    setDelBusy(null);
  };
  return (
    <div className="bg-white rounded-xl border border-slate-200 p-5 space-y-3 fade">
      <h2 className="font-bold text-slate-800">Sites ({sites.length})</h2>
      <div className="flex gap-2 items-center">
        <input disabled={busy} value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter'){ e.preventDefault(); add(); } }} maxLength={120} placeholder="New site (e.g. Heineken Brewery)" className="flex-1 min-w-0 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} />
        <button disabled={busy} onClick={add} style={{backgroundColor:t.secondary}} className="text-white font-semibold px-4 py-2 rounded-lg text-sm disabled:opacity-60 transition">{busy?'...':'Add'}</button>
      </div>
      <p className="text-xs text-slate-400">These fill the site dropdown on Plan Schedule and on audits. "Other" is always there for a one-off site. The list lives on the Sites tab of the Google Sheet too.</p>
      {msg && <p className={`text-sm font-medium ${msg.bad?'text-red-600':'text-emerald-600'}`}>{msg.text}</p>}
      <div className="flex flex-wrap gap-2 pt-1">
        {sites.length===0 && <p className="text-sm text-slate-400 italic">No sites yet.</p>}
        {sites.map(s=>
          <span key={s} className={`flex items-center gap-1 bg-slate-100 rounded-full pl-3 pr-1 py-1 text-sm text-slate-700 ${delBusy===s?'pointer-events-none opacity-50':''}`}>
            {s}
            <button disabled={delBusy===s} onClick={()=>del(s)} title={'Remove '+s} className="text-slate-400 hover:text-red-500 px-1 font-bold transition">{delBusy===s?'...':'×'}</button>
          </span>
        )}
      </div>
    </div>
  );
}

/* ---------------- Trainer Calendar View ---------------- */
function TrainerCalendar({ t, schedule, courses, onRun }){
  const [baseDate, setBaseDate] = useState(new Date());
  const [selDate, setSelDate] = useState(todayISO());

  const nextMonth = () => setBaseDate(new Date(baseDate.getFullYear(), baseDate.getMonth() + 1, 1));
  const prevMonth = () => setBaseDate(new Date(baseDate.getFullYear(), baseDate.getMonth() - 1, 1));

  const y = baseDate.getFullYear();
  const m = baseDate.getMonth();
  const firstDay = new Date(y, m, 1).getDay();
  const days = new Date(y, m + 1, 0).getDate();

  const sMap = {};
  schedule.forEach(s => {
    const key = String(s.date).slice(0,10);
    if(!sMap[key]) sMap[key] = [];
    sMap[key].push(s);
  });

  const cells = [];
  for(let i=0; i<firstDay; i++) cells.push(<div key={`e${i}`} className="p-2 opacity-0 pointer-events-none"></div>);
  for(let i=1; i<=days; i++){
    const dStr = `${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
    const hasJobs = !!sMap[dStr];
    const isSel = selDate === dStr;
    cells.push(
      <div key={i} onClick={()=>setSelDate(dStr)} className={`p-2 border rounded-lg cursor-pointer transition flex flex-col items-center justify-center h-12 ${isSel?'ring-2 ring-blue-500 bg-blue-50':hasJobs?'bg-emerald-50 border-emerald-200 hover:bg-emerald-100':'border-slate-100 hover:bg-slate-50'}`}>
        <p className={`text-sm font-semibold ${hasJobs?'text-emerald-700':'text-slate-600'}`}>{i}</p>
        {hasJobs && <div className="mt-1 w-1.5 h-1.5 bg-emerald-500 rounded-full"></div>}
      </div>
    );
  }

  const dayJobs = sMap[selDate] || [];

  return (
    <div className="grid lg:grid-cols-2 gap-6 items-start fade mb-8">
      <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
         <div className="flex justify-between items-center mb-4">
            <h2 className="font-bold text-lg text-slate-800 flex items-center gap-2"><I.cal size={18} style={{color:t.primary}}/> {baseDate.toLocaleString('default',{month:'long'})} {y}</h2>
            <div className="flex gap-2">
               <button onClick={prevMonth} className="p-1 hover:bg-slate-100 rounded text-slate-500 transition"><I.left size={20}/></button>
               <button onClick={nextMonth} className="p-1 hover:bg-slate-100 rounded text-slate-500 transition"><I.right size={20}/></button>
            </div>
         </div>
         <div className="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-slate-400 mb-2">
           <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
         </div>
         <div className="grid grid-cols-7 gap-1">{cells}</div>
      </div>

      <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 min-h-[310px]">
         <h3 className="font-bold text-slate-800 mb-4">{fmtUK(selDate)} Agenda</h3>
         {dayJobs.length===0 ? <p className="text-slate-400 text-sm italic">No site visits scheduled for this day.</p> : (
           <div className="space-y-3">
             {dayJobs.map(j => {
                const cObj = courses.find(c=>c.id == j.course || c.name == j.course);
                const cName = cObj ? cObj.name : j.course;
                return (
                  <div key={j.id} className="border border-slate-200 rounded-lg p-4 bg-slate-50 hover:bg-slate-100 transition">
                    <p className="font-bold text-slate-800 text-lg">{j.site}</p>
                    <p className="text-sm font-medium text-slate-600 mb-3">{cName} {cObj&&cObj.audit?<Badge tone="blue">Audit</Badge>:null}</p>
                    <button onClick={()=>onRun(j)} style={{backgroundColor:t.primary}} className="text-white text-xs font-semibold px-4 py-2.5 rounded-lg hover:brightness-110 transition shadow-sm w-full">{cObj&&cObj.audit?'Run audit':'Run session'}</button>
                  </div>
                )
             })}
           </div>
         )}
      </div>
    </div>
  );
}

/* ---------------- Give training ---------------- */
function GiveTraining({ t, me, employees, courses, schedule, sites, setSites, mailQuota, isAdmin, onIssued, reloadCourses }){
  const [schedId,setSchedId]=useState(null);
  const typeList=(courses&&courses.length)?courses:CONFIG.TRAINING_TYPES;

  const [sel,setSel]=useState({});
  const [type,setType]=useState(()=>typeList.length?String(typeList[0].id):'');
  const [newCourse,setNewCourse]=useState('');
  const [newCourseDur,setNewCourseDur]=useState(12);
  const [showCourses,setShowCourses]=useState(false);
  const [courseBusy,setCourseBusy]=useState(false);
  const [courseDelBusy,setCourseDelBusy]=useState(null);
  const [courseMsg,setCourseMsg]=useState(null);

  /* Fall back to the first course only when nothing valid is chosen. Decided on the
     latest value (not the one this render saw), so a session loaded by a quick tap on
     "Run audit" is never overwritten by this default landing a moment later. */
  useEffect(()=>{
    if(!typeList.length) return;
    setType(cur=>(cur && typeList.find(x=>x.id == cur)) ? cur : String(typeList[0].id));
  }, [courses, type]);

  const addCourse=async()=>{
    const n=newCourse.trim();
    if(!n){ setCourseMsg({bad:true,text:'Enter a course name.'}); return; }
    setCourseBusy(true); setCourseMsg(null);
    const tk=store.get(SESS).token;
    const r=await api('addCourse',{token:tk, name:n, duration:newCourseDur});
    setCourseBusy(false);
    if(r.ok){ setNewCourse(''); setNewCourseDur(12); reloadCourses(); setType(n); setCourseMsg({bad:false,text:/audit/i.test(n)?'Audit type added. It will not create certificates.':'Course added.'}); }
    else setCourseMsg({bad:true,text:errText(r)});
  };
  const delCourse=async(id)=>{
    if(!window.confirm('Remove this course?'))return;
    setCourseDelBusy(id); setCourseMsg(null);
    const tk=store.get(SESS).token;
    const r=await api('deleteCourse',{token:tk,name:id});
    setCourseDelBusy(null);
    if(r.ok){ reloadCourses(); setCourseMsg({bad:false,text:'Course removed.'}); }
    else setCourseMsg({bad:true,text:errText(r)});
  };

  const runSession=(sess)=>{
    const courseObjS = courses.find(c => c.id == sess.course || c.name == sess.course);
    if(courseObjS) setType(String(courseObjS.id));
    else if (courses.length > 0) setType(String(courses[0].id));

    setDate(String(sess.date).slice(0,10));
    setSite(sess.site||'');
    setSchedId(sess.id);
    const isAud = courseObjS && courseObjS.audit;
    setMsg({bad:false,text:'Session loaded: '+(courseObjS?courseObjS.name:sess.course)+' at '+sess.site+' on '+fmtUK(sess.date)+'. '+(isAud?'Add any notes and press Complete audit when done.':'Tick the people who attended and press Issue.')});
    window.scrollTo({ top: document.getElementById('issue-panel').offsetTop - 20, behavior: 'smooth' });
  };

  const [date,setDate]=useState(todayISO()); const [q,setQ]=useState('');
  const [site,setSite]=useState(''); const [notes,setNotes]=useState(''); const [saveSite,setSaveSite]=useState(true);
  /* A typed site an admin asked to keep: true only when it is not already on the list. */
  const wantSave=()=>isAdmin&&saveSite&&!!site.trim()&&!findSite(sites,site);
  const [busy,setBusy]=useState(false); const [msg,setMsg]=useState(null);
  const active=employees.filter(e=>e.active!==false);
  const list=active.filter(e=>!q||String(e.name).toLowerCase().includes(q.toLowerCase()));
  const chosen=active.filter(e=>sel[e.id]);
  const toggle=(id)=>setSel(s=>Object.assign({},s,{[id]:!s[id]}));
  const allShown=(v)=>{ const n=Object.assign({},sel); list.forEach(e=>n[e.id]=v); setSel(n); };

  const courseObj=typeList.find(c=>c.id==type);
  const isAudit=!!(courseObj&&courseObj.audit);
  const hasQual=!!(me&&me.qual&&String(me.qual).trim());
  const certBlocked=!isAudit&&!hasQual;

  const issue=async()=>{
    if(chosen.length===0){ setMsg({bad:true,text:'Tick at least one person.'}); return; }

    const actualCourseName = courseObj ? courseObj.name : 'Training';
    const siteName = canonSite(sites, site);

    /* Google caps how many emails the account can send a day (100 recipients on a
       free Gmail account). Each certificate goes to up to 3 people. Warn before
       running out rather than finding out from missing emails afterwards. */
    const need = chosen.length*3;
    const quotaNote = (mailQuota!==null && need>mailQuota) ? '\n\nWARNING: Google will only send about '+mailQuota+' more email'+(mailQuota===1?'':'s')+' today, so some certificates may not be emailed. They are still recorded and can be downloaded from the Dashboard.' : '';
    if(!window.confirm('Issue '+actualCourseName+' certificate'+(chosen.length>1?'s':'')+' for '+chosen.length+' '+(chosen.length>1?'people':'person')+(siteName?' at '+siteName:'')+'?\n\nThis will be emailed to each employee, the trainer, and the office.'+quotaNote)) return;
    setBusy(true); setMsg({bad:false,text:'Generating and emailing certificates...'});
    try{
      const b64=await loadCert(CONFIG.CERT_FILE);
      const tk=store.get(SESS).token; let emailedAll=true; let pdfSuccess=true; let lastPdfError=''; let noEmail=0; let failed=[];
      if(wantSave()){ try{ const rs=await api('addSite',{token:tk,name:siteName}); if(rs&&rs.ok&&rs.sites) setSites(rs.sites); }catch(e){} }

      const durationMonths = courseObj ? (parseInt(courseObj.duration) || 36) : 36;

      const instructorName = (me && me.name) || CONFIG.INSTRUCTOR.name;
      const instructorTitle = actualCourseName + ' Instructor';
      const instructorQual = (me && me.qual) || '';

      let n=0;
      for(const e of chosen){
        n++; setMsg({bad:false,text:`Generating and emailing certificates... ${n} of ${chosen.length}`});
        const issueDate=todayISO();
        const expiryDate=addMonths(date, durationMonths);

        const bytes=buildCertBytes(b64,{name:e.name,trainingType:actualCourseName,trainingDate:date,issueDate,expiryDate,durationMonths,instructorName,instructorTitle,instructorQual});

        const r=await api('recordTraining',{token:tk,employeeId:e.id,employee:e.name,email:e.email,trainingType:actualCourseName,trainingDate:date,issueDate,expiryDate,site:siteName,certBase64:uint8ToBase64(bytes)});
        if(!(r&&r.ok)){ failed.push(e.name+': '+errText(r)); continue; }
        if(!r.emailed) emailedAll=false;
        if(r.noEmail) noEmail++;
        if(r.emailedPdf===false) {
          pdfSuccess = false;
          lastPdfError = r.pdfError || 'Unknown API failure';
        }
      }

      const issued = chosen.length-failed.length;
      let finalMsg = `Issued ${issued} certificate(s). Emailed to the Office, Trainer, and Trainee.`;
      if(noEmail) finalMsg += ` ${noEmail} ${noEmail===1?'person has':'people have'} no email address on file, so the office and trainer got theirs.`;
      if(!emailedAll) finalMsg += ' (Note: Some emails bounced).';
      if(failed.length) finalMsg += ' NOT issued: '+failed.join('; ');
      if(!pdfSuccess) {
         console.error("PDF Conversion Failure Reason: ", lastPdfError);
         finalMsg += ' (Warning: Sent as DOCX. Tell your Admin to click "Run -> authorizeDriveAPI" in Apps Script.)';
      }

      if(schedId && issued>0){ try{ await api('completeSchedule',{token:tk,id:schedId}); }catch(e){} setSchedId(null); }
      setSel({});
      setMsg({bad:failed.length>0,text: finalMsg});
      onIssued&&onIssued();
    }catch(err){ setMsg({bad:true,text:'Could not issue: '+((err&&err.message)||'check your internet connection.')}); }
    finally{ setBusy(false); }
  };

  const doAudit=async()=>{
    if(!site.trim()){ setMsg({bad:true,text:'Choose the site for this audit, or pick Other and type it in.'}); return; }
    const actualName = courseObj ? courseObj.name : 'Audit';
    const siteName = canonSite(sites, site);
    if(!window.confirm('Mark '+actualName+' complete at '+siteName+'?\n\nA confirmation email goes to the office and to you. No certificates are issued.')) return;
    setBusy(true); setMsg({bad:false,text:'Recording audit...'});
    try{
      const tk=store.get(SESS).token;
      const r=await api('recordAudit',{token:tk,course:actualName,site:siteName,date,notes:notes.trim(),saveSite:wantSave()});
      if(r&&r.ok){
        /* Close the booked session and clear the form before saying "done", so tapping the
           next job straight away cannot have its site wiped by this one finishing late. */
        if(schedId){ try{ await api('completeSchedule',{token:tk,id:schedId}); }catch(e){} setSchedId(null); }
        if(r.sites) setSites(r.sites);
        setSite(''); setNotes(''); setSaveSite(true);
        setMsg({bad:false,text:'Audit recorded'+(r.emailed?' and emailed to the office and auditor.':'. (Warning: the email could not be sent.)')});
        onIssued&&onIssued();
      } else setMsg({bad:true,text:errText(r)});
    }catch(e){ setMsg({bad:true,text:'Could not reach the server.'}); }
    finally{ setBusy(false); }
  };

  const mySchedule = (schedule||[]).filter(s=>s.status!=='Done' && s.trainer===me.username).sort((a,b)=>new Date(a.date)-new Date(b.date));

  return (
    <div className="space-y-6 fade">
      <div className="flex items-center justify-between">
        <h1 className="text-2xl font-bold text-slate-900">{isAdmin ? 'Give training' : 'My Schedule'}</h1>
        {isAdmin && <button onClick={()=>setShowCourses(v=>!v)} className="text-sm font-semibold hover:opacity-80 transition" style={{color:t.primary}}>{showCourses?'Done':'Manage courses'}</button>}
      </div>

              </span>

      <div id="issue-panel" className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">

          <div className="flex items-end"><button onClick={isAudit?doAudit:issue} disabled={busy||certBlocked} style={{backgroundColor:t.secondary}} className="w-full text-white font-bold py-2.5 rounded-lg hover:brightness-110 shadow-sm transition disabled:opacity-60">{busy?'Working...':(isAudit?'Complete audit':`Issue ${chosen.length||''} cert${chosen.length===1?'':'s'}`)}</button></div>
