<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IFES Health &amp; Safety Portal</title>
<link rel="icon" href="https://www.tsg-solutions.com/wp-content/uploads/2026/01/ifes-logo-v3-204x300-1.webp" />

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.7/dist/pizzip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docxtemplater@3.50.0/build/docxtemplater.js"></script>
<style>@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.fade{animation:fade .25s ease-out}</style>
</head>
<body>
<div id="root"></div>

<script>
window.addEventListener('error', function(e){
  var r=document.getElementById('root');
  if(r && !r.hasChildNodes()){ r.innerHTML='<pre style="padding:20px;color:#b00020;white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,monospace">Startup error:\n\n'+((e&&(e.message||e.error))||'unknown')+'\n\nOpen the console (F12) for detail.</pre>'; }
});
</script>

<script type="text/plain" id="appsrc">
/* eslint-disable */
const { useState, useEffect, useRef } = React;

/* ===== CONFIG 2 ===== */
const CONFIG = {
  BACKEND_PREFIX: "https://script.google.com/macros/s/AKfycbz51Kg6kdeyAMvQ3d79NlVlqRGyTl-9jbWrDMYLzv3G7Je3CemcG0WGqX",
  LOGO_URL: "https://www.tsg-solutions.com/wp-content/uploads/2026/01/ifes-logo-v3-204x300-1.webp",
  CERT_FILE: "Cert.txt",
  /* Training fallback if sheet is empty. */
  TRAINING_TYPES: [ {id: "Manual Handling", name: "Manual Handling", duration: 36} ],
  /* Fallback instructor if a trainer has no qualification saved. */
  INSTRUCTOR: { name: "Cormac Farrell", title: "Manual Handling Instructor", qual: "QQI Level 6" }
};
const THEME = { primary:'#005C9C', secondary:'#0077C8', lightBg:'#F1F6FA' };

const store = {
  get(k){ try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;} },
  set(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} },
  del(k){ try{localStorage.removeItem(k);}catch(e){} }
};
const SESS='ifes_session';
const BOOT_CACHE='ifes_boot_cache';
let BACKEND_CODE=(function(){ try{return JSON.parse(localStorage.getItem('backend_code'))||'';}catch(e){return '';} })();
const backendReady=()=>BACKEND_CODE.length>0;
const backendUrl=()=>CONFIG.BACKEND_PREFIX+BACKEND_CODE+"/exec";

const todayISO = () => {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
};

const addMonths = (iso, m) => {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  d.setMonth(d.getMonth() + parseInt(m));
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
};

const fmtUK=(iso)=>{ if(!iso)return ''; const d=new Date(iso); if(isNaN(d))return String(iso); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); };

const daysUntil=(iso)=>{ if(!iso)return null; return Math.ceil((new Date(iso)-new Date())/86400000); };

/* Turn a duration in months into wording for the certificate: 12 -> "1 year",
   36 -> "3 years", 18 -> "18 months", 6 -> "6 months". */
const validForText=(months)=>{
  const m=parseInt(months); if(!m||m<1) return '';
  if(m%12===0){ const y=m/12; return y+(y===1?' year':' years'); }
  return m+(m===1?' month':' months');
};
const monthsBetween=(fromIso,toIso)=>{
  const a=new Date(fromIso), b=new Date(toIso);
  if(isNaN(a)||isNaN(b)) return 0;
  return (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth());
};
const genPassword=()=>{ const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'; let s=''; for(let i=0;i<8;i++)s+=c[Math.floor(Math.random()*c.length)]; return s; };
const safeName=(n)=>String(n).replace(/[^A-Za-z0-9]+/g,'_');

/* Courses come from the sheet as {name, duration}. Normalise them so the
   name doubles as a stable id, and flag any course whose name contains
   the word audit as a no-certificate audit type. */
const normCourses=(list)=>(list||[]).map(c=>({
  id:String(c.name), name:c.name, duration:c.duration, audit:/audit/i.test(String(c.name))
}));

function errText(r){
  if(!r) return 'No reply from the server.';
  if(r.error==='unknown_action') return 'Your backend is running an OLD version. In Apps Script: Deploy > Manage deployments > pencil > Version: New version > Deploy.';
  if(r.error==='auth') return 'Your session expired. Log out and back in.';
  if(r.error==='forbidden') return 'Your login does not have permission for that.';
  if(r.error==='exists') return 'That one already exists.';
  if(r.error==='no_qual') return 'Your login has no qualification saved, so you cannot issue certificates. Ask an admin to add it on the Logins tab.';
  if(r.error==='system_busy') return r.message;
  if(r.message) return r.message;
  return 'Server said: '+(r.error||'unknown error');
}
async function api(action,payload){
  let res;
  try{ res=await fetch(backendUrl(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},payload))}); }
  catch(e){ throw {code:'network'}; }
  try{ return await res.json(); }catch(e){ throw {code:'bad_endpoint'}; }
}

const CERT_CACHE={};
async function loadCert(file){
  if(CERT_CACHE[file]) return CERT_CACHE[file];
  const r=await fetch(file);
  if(!r.ok) throw {message:'Could not load '+file+' (make sure it sits next to index.html on the host).'};
  CERT_CACHE[file]=(await r.text()).replace(/\s+/g,'');
  return CERT_CACHE[file];
}
function buildCertBytes(b64,data){
  const bin=atob(b64); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  const zip=new PizZip(bytes);
  const Docx=(window.docxtemplater&&window.docxtemplater.default)?window.docxtemplater.default:window.docxtemplater;
  const doc=new Docx(zip,{paragraphLoop:true,linebreaks:true});
  const validFor = data.validFor || validForText(data.durationMonths) || validForText(monthsBetween(data.trainingDate,data.expiryDate)) || '';
  doc.render({
    employeeName:data.name,
    trainingType:data.trainingType||'',
    trainingTypeLower:(data.trainingType||'').toLowerCase(),
    trainingDate:fmtUK(data.trainingDate),
    issueDate:fmtUK(data.issueDate),
    expiryDate:fmtUK(data.expiryDate),
    validFor:validFor,
    instructorName:data.instructorName,
    instructorTitle:data.instructorTitle,
    instructorQual:data.instructorQual
  });
  return doc.getZip().generate({type:'uint8array'});
}
function uint8ToBase64(u8){ let s=''; const chunk=0x8000; for(let i=0;i<u8.length;i+=chunk){ s+=String.fromCharCode.apply(null,u8.subarray(i,i+chunk)); } return btoa(s); }
function downloadBlob(blob,filename){ const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1500); }
const DOCX_MIME='application/vnd.openxmlformats-officedocument.wordprocessingml.document';

const I={
  cal:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>,
  grid:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>,
  cert:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="4" y="4" width="16" height="12" rx="1"/><circle cx="12" cy="18" r="2.5"/><path d="M10.5 20L9 23l3-1.5L15 23l-1.5-3"/></svg>,
  users:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.3 3-5 6.5-5s6.5 1.7 6.5 5"/><path d="M17 5a3 3 0 010 6M18 20c0-2.2-1-3.7-2.5-4.6"/></svg>,
  user:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>,
  plus:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 5v14M5 12h14"/></svg>,
  up:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 20h16"/></svg>,
  down:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>,
  out:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>,
  trash:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>,
  lock:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>,
  check:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 6L9 17l-5-5"/></svg>,
  pencil:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>,
  clip:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4a3 3 0 016 0"/><path d="M9 11l2 2 4-4"/></svg>,
  left:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M15 18l-6-6 6-6"/></svg>,
  right:(p)=><svg {...p} width={p.size||20} height={p.size||20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 18l6-6-6-6"/></svg>
};
const roleLabel=(r)=> r==='superadmin'?'Super admin':r==='admin'?'Admin':'Trainer';
const Badge=({children,tone})=>{ const m={green:'bg-emerald-100 text-emerald-700',amber:'bg-amber-100 text-amber-700',red:'bg-red-100 text-red-700',slate:'bg-slate-100 text-slate-600',blue:'bg-sky-100 text-sky-700'}; return <span className={`text-xs font-semibold px-2 py-0.5 rounded-full ${m[tone]||m.slate}`}>{children}</span>; };
const Logo=({className})=> <img src={CONFIG.LOGO_URL} alt="IFES" className={className} onError={(e)=>{e.target.style.display='none';}} />;

/* ===================== APP ===================== */
function App(){
  const t=THEME;
  const [ready,setReady]=useState(false);
  const [me,setMe]=useState(null);
  const [tab,setTab]=useState('give');
  const [users,setUsers]=useState([]);
  const [employees,setEmployees]=useState([]);
  const [training,setTraining]=useState([]);
  const [courses,setCourses]=useState([]);
  const [schedule,setSchedule]=useState([]);
  const [showPw,setShowPw]=useState(false);
  const skipNextLoad=useRef(false);
  const isAdmin=me&&(me.role==='admin'||me.role==='superadmin');

  /* Apply a bootstrap payload to state and cache it for instant startup next time. */
  const applyBoot=(r)=>{
    setEmployees(r.employees||[]); setTraining(r.training||[]);
    setCourses(normCourses(r.courses||[])); setSchedule(r.schedule||[]);
    if(r.users)setUsers(r.users);
    store.set(BOOT_CACHE,{employees:r.employees||[],training:r.training||[],courses:r.courses||[],schedule:r.schedule||[],users:r.users||null});
  };

  useEffect(()=>{ (async()=>{
    const sess=store.get(SESS);
    if(sess&&sess.token&&sess.me&&backendReady()){
      /* Show the last known data instantly, then refresh in the background. */
      const cache=store.get(BOOT_CACHE);
      if(cache){
        setEmployees(cache.employees||[]); setTraining(cache.training||[]);
        setCourses(normCourses(cache.courses||[])); setSchedule(cache.schedule||[]);
        if(cache.users)setUsers(cache.users);
      }
      setMe(Object.assign({token:sess.token},sess.me));
    }
    setReady(true);
  })(); },[]);

  const [loadErr,setLoadErr]=useState('');
  const loadData=async()=>{
    const tk=me&&me.token; if(!tk)return;
    try{
      const r=await api('bootstrap',{token:tk});
      if(r.ok){
        applyBoot(r);
        if(r.qual!==undefined && r.qual!==me.qual){ const upd=Object.assign({},me,{qual:r.qual}); setMe(upd); store.set(SESS,{token:upd.token,me:{username:upd.username,name:upd.name,role:upd.role,qual:upd.qual}}); }
        setLoadErr('');
      }
      else setLoadErr(errText(r));
    }catch(e){ setLoadErr('Could not reach the server.'); }
  };

  const meToken = me ? me.token : null;
  useEffect(()=>{ if(me){ setTab(isAdmin?'dashboard':'give'); if(skipNextLoad.current){ skipNextLoad.current=false; } else loadData(); } },[meToken]);

  const onLogin=(d)=>{
    store.set(SESS,{token:d.token,me:{username:d.username,name:d.name,role:d.role,qual:d.qual||''}});
    if(d.data){ applyBoot(d.data); skipNextLoad.current=true; }
    setMe({token:d.token,username:d.username,name:d.name,role:d.role,qual:d.qual||''});
  };
  const logout=()=>{ store.del(SESS); store.del(BOOT_CACHE); setMe(null); setUsers([]); setEmployees([]); setTraining([]); setSchedule([]); };

  /* Optimistic local updates: rows disappear instantly, server confirms in the background. */
  const patch={
    removeEmployee:(id)=>setEmployees(l=>l.filter(x=>x.id!==id)),
    removeUser:(un)=>setUsers(l=>l.filter(x=>x.username!==un)),
    removeTraining:(id)=>setTraining(l=>l.filter(x=>x.id!==id)),
    removeSchedule:(id)=>setSchedule(l=>l.filter(x=>x.id!==id))
  };

  if(!ready) return <div className="min-h-screen flex items-center justify-center text-slate-400">Loading...</div>;
  if(!me) return <Login t={t} onLogin={onLogin} />;

  const NavBtn=({id,icon,label})=>(
    <button onClick={()=>setTab(id)} style={{backgroundColor:tab===id?t.secondary:'transparent'}}
      className={`flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium transition ${tab===id?'text-white shadow-sm':'text-white/80 hover:bg-white/10'}`}>{icon}<span className="hidden sm:inline">{label}</span></button>
  );

  return (
    <div className="min-h-screen" style={{backgroundColor:t.lightBg}}>
      <header className="bg-white border-b border-slate-200 shadow-sm">
        <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
          <div className="flex items-center gap-3"><Logo className="h-10 object-contain" /><span className="text-slate-400 font-medium text-sm hidden sm:inline">H&amp;S Portal</span></div>
          <div className="flex items-center gap-3">
            <span className="hidden sm:flex items-center gap-2 text-sm text-slate-600"><I.user size={16}/> {me.name} <Badge tone="blue">{roleLabel(me.role)}</Badge></span>
            <button onClick={()=>setShowPw(true)} className="flex items-center gap-1 text-slate-500 hover:text-slate-800 text-sm font-medium"><I.lock size={16}/><span className="hidden sm:inline">Password</span></button>
            <button onClick={logout} className="flex items-center gap-1 text-slate-500 hover:text-slate-800 text-sm font-medium"><I.out size={16}/><span className="hidden sm:inline">Log out</span></button>
          </div>
        </div>
      </header>
      <nav style={{backgroundColor:t.primary}} className="text-white shadow">
        <div className="max-w-6xl mx-auto px-4 flex gap-2 h-12 items-center">
          {isAdmin && <NavBtn id="dashboard" icon={<I.grid size={17}/>} label="Dashboard" />}
          <NavBtn id="give" icon={<I.cert size={17}/>} label="Give training" />
          {isAdmin && <NavBtn id="schedule" icon={<I.cal size={17}/>} label="Plan Schedule" />}
          {isAdmin && <NavBtn id="employees" icon={<I.users size={17}/>} label="Employees" />}
          {isAdmin && <NavBtn id="people" icon={<I.user size={17}/>} label="Logins" />}
          <a href="schedule.html" target="_blank" rel="noopener" className="flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium text-white/80 hover:bg-white/10 transition ml-auto" title="Open the full read-only schedule (agenda, month and year views)"><I.cal size={17}/><span className="hidden sm:inline">Schedule board</span></a>
        </div>
      </nav>
      <main className="max-w-6xl mx-auto px-4 py-8">
        {loadErr && <div className="mb-6 bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 text-sm font-medium">{loadErr}</div>}
        {tab==='dashboard' && isAdmin && <Dashboard t={t} training={training} onDelete={loadData} patch={patch} me={me} />}
        {tab==='give' && <GiveTraining t={t} me={me} employees={employees} courses={courses} schedule={schedule} isAdmin={isAdmin} onIssued={loadData} reloadCourses={loadData} />}
        {tab==='schedule' && isAdmin && <Schedule t={t} courses={courses} schedule={schedule} users={users} reload={loadData} patch={patch} />}
        {tab==='employees' && isAdmin && <Employees t={t} employees={employees} reload={loadData} patch={patch} />}
        {tab==='people' && isAdmin && <People t={t} me={me} users={users} reload={loadData} patch={patch} />}
      </main>
      {showPw && <ChangePassword t={t} onClose={()=>setShowPw(false)} />}
    </div>
  );
}

/* ---------------- Login ---------------- */
function Login({ t, onLogin }){
  const [username,setU]=useState(''); const [password,setP]=useState(''); const [code,setCode]=useState('');
  const [needCode,setNeedCode]=useState(!backendReady()); const [err,setErr]=useState(''); const [busy,setBusy]=useState(false);
  const submit=async(e)=>{ e.preventDefault(); setErr(''); setBusy(true);
    try{
      if(CONFIG.BACKEND_PREFIX.indexOf('http')!==0){ setErr('Backend not set up in the app yet.'); setBusy(false); return; }
      if(needCode){ if(!code.trim()){ setErr('Enter your access code.'); setBusy(false); return; } BACKEND_CODE=code.trim(); }
      const r=await api('login',{username:username.trim(),password});
      if(r.ok){ store.set('backend_code',BACKEND_CODE); onLogin({username:r.username,name:r.name,role:r.role,qual:r.qual||'',token:r.token,data:r.data||null}); }
      else setErr('Wrong username or password.');
    }catch(e){ if(e&&e.code==='bad_endpoint'){ setErr('That access code does not match. Check the last 12 characters.'); if(needCode)BACKEND_CODE=''; } else setErr('Could not reach the server. Check your internet connection.'); }
    finally{ setBusy(false); }
  };

  const hardReset = () => { localStorage.clear(); window.location.reload(); };

  return (
    <div className="min-h-screen flex items-center justify-center p-4" style={{backgroundColor:t.lightBg}}>
      <form onSubmit={submit} className="w-full max-w-sm bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden fade">
        <div className="px-8 py-8 text-center border-b border-slate-100"><Logo className="h-16 mx-auto object-contain" /><p className="text-slate-500 text-sm mt-3 font-medium">Health &amp; Safety Portal</p></div>
        <div className="p-8 space-y-4">
          {needCode && <div><label className="block text-sm font-semibold text-slate-700 mb-1">Access code <span className="font-normal text-slate-400">(first time here)</span></label><input value={code} onChange={e=>setCode(e.target.value)} placeholder="12-character code" className="w-full border border-slate-300 rounded-lg px-3 py-2.5 font-mono focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} /></div>}
          <div><label className="block text-sm font-semibold text-slate-700 mb-1">Username</label><input autoFocus value={username} onChange={e=>setU(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} /></div>
          <div><label className="block text-sm font-semibold text-slate-700 mb-1">Password</label><input type="password" value={password} onChange={e=>setP(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} /></div>
          {err && <p className="text-sm text-red-600 font-medium">{err}</p>}

          <div className="flex justify-between items-center">
            {!needCode && <button type="button" onClick={()=>setNeedCode(true)} className="text-xs text-slate-400 underline hover:text-slate-600">Change access code</button>}
            <button type="button" onClick={hardReset} className="text-xs text-red-400 underline hover:text-red-600">Reset App Connection</button>
          </div>

          <button disabled={busy} style={{backgroundColor:t.secondary}} className="w-full text-white font-bold py-2.5 rounded-lg hover:brightness-95 transition disabled:opacity-60">{busy?'Signing in...':'Sign in'}</button>
        </div>
      </form>
    </div>
  );
}

/* ---------------- Trainer Calendar View ---------------- */
function TrainerCalendar({ t, schedule, courses, onRun }){
  const [baseDate, setBaseDate] = useState(new Date());
  const [selDate, setSelDate] = useState(todayISO());

  const nextMonth = () => setBaseDate(new Date(baseDate.getFullYear(), baseDate.getMonth() + 1, 1));
  const prevMonth = () => setBaseDate(new Date(baseDate.getFullYear(), baseDate.getMonth() - 1, 1));

  const y = baseDate.getFullYear();
  const m = baseDate.getMonth();
  const firstDay = new Date(y, m, 1).getDay();
  const days = new Date(y, m + 1, 0).getDate();

  const sMap = {};
  schedule.forEach(s => {
    const key = String(s.date).slice(0,10);
    if(!sMap[key]) sMap[key] = [];
    sMap[key].push(s);
  });

  const cells = [];
  for(let i=0; i<firstDay; i++) cells.push(<div key={`e${i}`} className="p-2 opacity-0 pointer-events-none"></div>);
  for(let i=1; i<=days; i++){
    const dStr = `${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
    const hasJobs = !!sMap[dStr];
    const isSel = selDate === dStr;
    cells.push(
      <div key={i} onClick={()=>setSelDate(dStr)} className={`p-2 border rounded-lg cursor-pointer transition flex flex-col items-center justify-center h-12 ${isSel?'ring-2 ring-blue-500 bg-blue-50':hasJobs?'bg-emerald-50 border-emerald-200 hover:bg-emerald-100':'border-slate-100 hover:bg-slate-50'}`}>
        <p className={`text-sm font-semibold ${hasJobs?'text-emerald-700':'text-slate-600'}`}>{i}</p>
        {hasJobs && <div className="mt-1 w-1.5 h-1.5 bg-emerald-500 rounded-full"></div>}
      </div>
    );
  }

  const dayJobs = sMap[selDate] || [];

  return (
    <div className="grid lg:grid-cols-2 gap-6 items-start fade mb-8">
      <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
         <div className="flex justify-between items-center mb-4">
            <h2 className="font-bold text-lg text-slate-800 flex items-center gap-2"><I.cal size={18} style={{color:t.primary}}/> {baseDate.toLocaleString('default',{month:'long'})} {y}</h2>
            <div className="flex gap-2">
               <button onClick={prevMonth} className="p-1 hover:bg-slate-100 rounded text-slate-500 transition"><I.left size={20}/></button>
               <button onClick={nextMonth} className="p-1 hover:bg-slate-100 rounded text-slate-500 transition"><I.right size={20}/></button>
            </div>
         </div>
         <div className="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-slate-400 mb-2">
           <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
         </div>
         <div className="grid grid-cols-7 gap-1">{cells}</div>
      </div>

      <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 min-h-[310px]">
         <h3 className="font-bold text-slate-800 mb-4">{fmtUK(selDate)} Agenda</h3>
         {dayJobs.length===0 ? <p className="text-slate-400 text-sm italic">No site visits scheduled for this day.</p> : (
           <div className="space-y-3">
             {dayJobs.map(j => {
                const cObj = courses.find(c=>c.id == j.course || c.name == j.course);
                const cName = cObj ? cObj.name : j.course;
                return (
                  <div key={j.id} className="border border-slate-200 rounded-lg p-4 bg-slate-50 hover:bg-slate-100 transition">
                    <p className="font-bold text-slate-800 text-lg">{j.site}</p>
                    <p className="text-sm font-medium text-slate-600 mb-3">{cName} {cObj&&cObj.audit?<Badge tone="blue">Audit</Badge>:null}</p>
                    <button onClick={()=>onRun(j)} style={{backgroundColor:t.primary}} className="text-white text-xs font-semibold px-4 py-2.5 rounded-lg hover:brightness-110 transition shadow-sm w-full">{cObj&&cObj.audit?'Run audit':'Run session'}</button>
                  </div>
                )
             })}
           </div>
         )}
      </div>
    </div>
  );
}

/* ---------------- Give training ---------------- */
function GiveTraining({ t, me, employees, courses, schedule, isAdmin, onIssued, reloadCourses }){
  const [schedId,setSchedId]=useState(null);
  const typeList=(courses&&courses.length)?courses:CONFIG.TRAINING_TYPES;

  const [sel,setSel]=useState({});
  const [type,setType]=useState('');
  const [newCourse,setNewCourse]=useState('');
  const [newCourseDur,setNewCourseDur]=useState(12);
  const [showCourses,setShowCourses]=useState(false);
  const [courseBusy,setCourseBusy]=useState(false);
  const [courseDelBusy,setCourseDelBusy]=useState(null);
  const [courseMsg,setCourseMsg]=useState(null);

  useEffect(()=>{
    if((!type || !typeList.find(x=>x.id == type)) && typeList.length) {
      setType(typeList[0].id);
    }
  }, [courses, type]);

  const addCourse=async()=>{
    const n=newCourse.trim();
    if(!n){ setCourseMsg({bad:true,text:'Enter a course name.'}); return; }
    setCourseBusy(true); setCourseMsg(null);
    const tk=store.get(SESS).token;
    const r=await api('addCourse',{token:tk, name:n, duration:newCourseDur});
    setCourseBusy(false);
    if(r.ok){ setNewCourse(''); setNewCourseDur(12); reloadCourses(); setType(n); setCourseMsg({bad:false,text:/audit/i.test(n)?'Audit type added. It will not create certificates.':'Course added.'}); }
    else setCourseMsg({bad:true,text:errText(r)});
  };
  const delCourse=async(id)=>{
    if(!window.confirm('Remove this course?'))return;
    setCourseDelBusy(id); setCourseMsg(null);
    const tk=store.get(SESS).token;
    const r=await api('deleteCourse',{token:tk,name:id});
    setCourseDelBusy(null);
    if(r.ok){ reloadCourses(); setCourseMsg({bad:false,text:'Course removed.'}); }
    else setCourseMsg({bad:true,text:errText(r)});
  };

  const runSession=(sess)=>{
    const courseObjS = courses.find(c => c.id == sess.course || c.name == sess.course);
    if(courseObjS) setType(String(courseObjS.id));
    else if (courses.length > 0) setType(String(courses[0].id));

    setDate(String(sess.date).slice(0,10));
    setSite(sess.site||'');
    setSchedId(sess.id);
    const isAud = courseObjS && courseObjS.audit;
    setMsg({bad:false,text:'Session loaded: '+(courseObjS?courseObjS.name:sess.course)+' at '+sess.site+' on '+fmtUK(sess.date)+'. '+(isAud?'Add any notes and press Complete audit when done.':'Tick the people who attended and press Issue.')});
    window.scrollTo({ top: document.getElementById('issue-panel').offsetTop - 20, behavior: 'smooth' });
  };

  const [date,setDate]=useState(todayISO()); const [q,setQ]=useState('');
  const [site,setSite]=useState(''); const [notes,setNotes]=useState('');
  const [busy,setBusy]=useState(false); const [msg,setMsg]=useState(null);
  const active=employees.filter(e=>e.active!==false);
  const list=active.filter(e=>!q||String(e.name).toLowerCase().includes(q.toLowerCase()));
  const chosen=active.filter(e=>sel[e.id]);
  const toggle=(id)=>setSel(s=>Object.assign({},s,{[id]:!s[id]}));
  const allShown=(v)=>{ const n=Object.assign({},sel); list.forEach(e=>n[e.id]=v); setSel(n); };

  const courseObj=typeList.find(c=>c.id==type);
  const isAudit=!!(courseObj&&courseObj.audit);
  const hasQual=!!(me&&me.qual&&String(me.qual).trim());
  const certBlocked=!isAudit&&!hasQual;

  const issue=async()=>{
    if(chosen.length===0){ setMsg({bad:true,text:'Tick at least one person.'}); return; }

    const actualCourseName = courseObj ? courseObj.name : 'Training';

    if(!window.confirm('Issue '+actualCourseName+' certificate'+(chosen.length>1?'s':'')+' for '+chosen.length+' '+(chosen.length>1?'people':'person')+'?\n\nThis will be emailed to each employee, the trainer, and the office.')) return;
    setBusy(true); setMsg({bad:false,text:'Generating and emailing certificates...'});
    try{
      const b64=await loadCert(CONFIG.CERT_FILE);
      const tk=store.get(SESS).token; let emailedAll=true; let pdfSuccess=true; let lastPdfError='';

      const durationMonths = courseObj ? (parseInt(courseObj.duration) || 36) : 36;

      const instructorName = (me && me.name) || CONFIG.INSTRUCTOR.name;
      const instructorTitle = actualCourseName + ' Instructor';
      const instructorQual = (me && me.qual) || '';

      for(const e of chosen){
        const issueDate=todayISO();
        const expiryDate=addMonths(date, durationMonths);

        const bytes=buildCertBytes(b64,{name:e.name,trainingType:actualCourseName,trainingDate:date,issueDate,expiryDate,durationMonths,instructorName,instructorTitle,instructorQual});

        const r=await api('recordTraining',{token:tk,employee:e.name,email:e.email,trainingType:actualCourseName,trainingDate:date,issueDate,expiryDate,certBase64:uint8ToBase64(bytes)});
        if(!(r&&r.ok&&r.emailed)) emailedAll=false;
        if(r && r.ok && r.emailedPdf===false) {
          pdfSuccess = false;
          lastPdfError = r.pdfError || 'Unknown API failure';
        }
      }

      let finalMsg = `Issued ${chosen.length} certificate(s). Emailed to the Office, Trainer, and Trainee.`;
      if(!emailedAll) finalMsg += ' (Note: Some emails bounced).';
      if(!pdfSuccess) {
         console.error("PDF Conversion Failure Reason: ", lastPdfError);
         finalMsg += ' (Warning: Sent as DOCX. Tell your Admin to click "Run -> authorizeDriveAPI" in Apps Script.)';
      }

      setMsg({bad:false,text: finalMsg});
      if(schedId){ await api('completeSchedule',{token:tk,id:schedId}); setSchedId(null); }
      setSel({}); onIssued&&onIssued();
    }catch(err){ setMsg({bad:true,text:'Could not issue: '+((err&&err.message)||'check your internet connection.')}); }
    finally{ setBusy(false); }
  };

  const doAudit=async()=>{
    if(!site.trim()){ setMsg({bad:true,text:'Enter the site for this audit.'}); return; }
    const actualName = courseObj ? courseObj.name : 'Audit';
    if(!window.confirm('Mark '+actualName+' complete at '+site.trim()+'?\n\nA confirmation email goes to the office and to you. No certificates are issued.')) return;
    setBusy(true); setMsg({bad:false,text:'Recording audit...'});
    try{
      const tk=store.get(SESS).token;
      const r=await api('recordAudit',{token:tk,course:actualName,site:site.trim(),date,notes:notes.trim()});
      if(r&&r.ok){
        setMsg({bad:false,text:'Audit recorded'+(r.emailed?' and emailed to the office and auditor.':'. (Warning: the email could not be sent.)')});
        if(schedId){ await api('completeSchedule',{token:tk,id:schedId}); setSchedId(null); }
        setSite(''); setNotes(''); onIssued&&onIssued();
      } else setMsg({bad:true,text:errText(r)});
    }catch(e){ setMsg({bad:true,text:'Could not reach the server.'}); }
    finally{ setBusy(false); }
  };

  const mySchedule = (schedule||[]).filter(s=>s.status!=='Done' && s.trainer===me.username).sort((a,b)=>new Date(a.date)-new Date(b.date));

  return (
    <div className="space-y-6 fade">
      <div className="flex items-center justify-between">
        <h1 className="text-2xl font-bold text-slate-900">{isAdmin ? 'Give training' : 'My Schedule'}</h1>
        {isAdmin && <button onClick={()=>setShowCourses(v=>!v)} className="text-sm font-semibold hover:opacity-80 transition" style={{color:t.primary}}>{showCourses?'Done':'Manage courses'}</button>}
      </div>

      {!isAdmin && <TrainerCalendar t={t} schedule={mySchedule} courses={courses} onRun={runSession} />}

      {isAdmin && showCourses && (
        <div className="bg-white rounded-xl border border-slate-200 p-5 space-y-3">
          <h2 className="font-bold text-slate-800">Training courses</h2>
          <div className="flex gap-2 items-center">
            <input disabled={courseBusy} value={newCourse} onChange={e=>setNewCourse(e.target.value)} placeholder="New course (e.g. Fire Safety)" className="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} />
            <input disabled={courseBusy} type="number" min="1" value={newCourseDur} onChange={e=>setNewCourseDur(e.target.value)} placeholder="Months valid" title="Duration in months" className="w-32 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} />
            <span className="text-sm text-slate-500 font-medium hidden sm:inline">months</span>
            <button disabled={courseBusy} onClick={addCourse} style={{backgroundColor:t.secondary}} className="text-white font-semibold px-4 py-2 rounded-lg text-sm ml-2 disabled:opacity-60 transition">{courseBusy?'...':'Add'}</button>
          </div>
          <p className="text-xs text-slate-400">Tip: include the word audit in the name (e.g. Site Audit) to make it an audit type. Audits email the office and the auditor, and do not create certificates.</p>
          {courseMsg && <p className={`text-sm font-medium ${courseMsg.bad?'text-red-600':'text-emerald-600'}`}>{courseMsg.text}</p>}
          <div className="flex flex-wrap gap-2 pt-2">
            {typeList.map(c=>
              <span key={c.id} className={`flex items-center gap-1 bg-slate-100 rounded-full pl-3 pr-1 py-1 text-sm text-slate-700 opacity-90 ${courseDelBusy===c.id?'pointer-events-none opacity-50':''}`}>
                {c.name} <span className="text-slate-400 text-xs">{c.audit?'(audit)':`(${c.duration}m)`}</span>
                <button disabled={courseDelBusy===c.id} onClick={()=>delCourse(c.id)} className="text-slate-400 hover:text-red-500 px-1 font-bold disabled:opacity-50 transition">{courseDelBusy===c.id ? '...' : '\u00D7'}</button>
              </span>
            )}
          </div>
        </div>
      )}

      <div id="issue-panel" className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
        <div className="p-5 grid sm:grid-cols-3 gap-4 border-b border-slate-100 bg-slate-50/50">
          <div><label className="block text-xs font-semibold text-slate-600 mb-1">{isAudit?'Audit type':'Training type'}</label>
            <select value={type} onChange={e=>setType(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}}>
              {typeList.map(x=><option key={x.id} value={x.id}>{x.name} {x.audit?'(audit)':`(${x.duration} months)`}</option>)}
            </select></div>
          <div><label className="block text-xs font-semibold text-slate-600 mb-1">{isAudit?'Audit date':'Training date'}</label>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} /></div>
          <div className="flex items-end"><button onClick={isAudit?doAudit:issue} disabled={busy||certBlocked} style={{backgroundColor:t.secondary}} className="w-full text-white font-bold py-2.5 rounded-lg hover:brightness-110 shadow-sm transition disabled:opacity-60">{busy?'Working...':(isAudit?'Complete audit':`Issue ${chosen.length||''} cert${chosen.length===1?'':'s'}`)}</button></div>
        </div>
        {certBlocked && (
          <div className="px-5 py-3 border-b border-amber-100 bg-amber-50 text-amber-800 text-sm font-medium flex items-center gap-2">
            <I.lock size={15}/> Your login has no qualification saved, so you cannot issue certificates. Ask an admin to add it on the Logins tab. Audits are still available.
          </div>
        )}
        {isAudit && (
          <div className="p-5 space-y-3 border-b border-slate-100">
            <div className="grid sm:grid-cols-2 gap-4">
              <div><label className="block text-xs font-semibold text-slate-600 mb-1">Site / Location</label>
                <input value={site} onChange={e=>setSite(e.target.value)} placeholder="e.g. Building A" className="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} /></div>
              <div><label className="block text-xs font-semibold text-slate-600 mb-1">Notes (optional, included in the email)</label>
                <input value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Any findings or comments" className="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} /></div>
            </div>
            <p className="text-xs text-slate-400 flex items-center gap-1.5"><I.clip size={14}/> No certificates are issued for audits. A confirmation email goes to the office and to you.</p>
          </div>
        )}
        {!isAudit && (
          <div className="p-4 flex items-center gap-3 border-b border-slate-100">
            <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search people" className="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} />
            <button onClick={()=>allShown(true)} className="text-sm font-semibold hover:opacity-80 transition" style={{color:t.primary}}>Select all</button>
            <button onClick={()=>allShown(false)} className="text-sm text-slate-500 hover:text-slate-800 transition">Clear</button>
          </div>
        )}
        {msg && <p className={`px-5 py-3 text-sm font-medium ${msg.bad?'text-red-600':'text-emerald-600'}`}>{msg.text}</p>}
        {!isAudit && (
          <ul className="divide-y divide-slate-100 max-h-96 overflow-auto">
            {active.length===0 && <li className="p-6 text-slate-400 italic">No employees yet. Add them on the Employees tab.</li>}
            {list.map(e=>(
              <li key={e.id} className="px-5 py-2.5 flex items-center gap-3 cursor-pointer hover:bg-slate-50 transition" onClick={()=>toggle(e.id)}>
                <input type="checkbox" checked={!!sel[e.id]} readOnly className="w-4 h-4 pointer-events-none" />
                <div><p className="font-medium text-slate-800 text-sm">{e.name}</p><p className="text-xs text-slate-400">{e.email||'no email'}</p></div>
              </li>
            ))}
          </ul>
        )}
      </div>
    </div>
  );
}

/* ---------------- Schedule (admin plans a session) ---------------- */
function Schedule({ t, courses, schedule, users, reload, patch }){
  const [course,setCourse]=useState('');
  const [date,setDate]=useState(todayISO());
  const [site,setSite]=useState('');
  const [trainer,setTrainer]=useState('');
  const [msg,setMsg]=useState(null);
  const [busy,setBusy]=useState(false);

  useEffect(()=>{
    if(!course && courses.length) setCourse(String(courses[0].id));
    if(!trainer && users.length) setTrainer(users[0].username);
  },[courses, users]);

  const save=async()=>{
    if(!site.trim()){ setMsg({bad:true,text:'Enter a site location.'}); return; }
    if(!course){ setMsg({bad:true,text:'Pick a course.'}); return; }
    if(!trainer){ setMsg({bad:true,text:'Pick a trainer.'}); return; }

    setBusy(true); setMsg({bad:false,text:'Saving session...'});
    const tk=store.get(SESS).token;
    const r=await api('addSchedule',{token:tk,course,date,site:site.trim(),trainer});
    setBusy(false);
    if(r.ok){ setSite(''); setMsg({bad:false,text:'Session scheduled. It will appear on the trainer\'s dashboard.'}); reload(); }
    else setMsg({bad:true,text:errText(r)});
  };

  const del=async(s)=>{
    if(!window.confirm('Delete this planned session?'))return;
    patch.removeSchedule(s.id);
    const tk=store.get(SESS).token;
    const r=await api('deleteSchedule',{token:tk,id:s.id});
    if(!r||!r.ok){ alert('Could not delete that session.'); reload(); }
  };

  const planned=(schedule||[]).filter(s=>s.status!=='Done').sort((a,b)=>new Date(a.date)-new Date(b.date));

  return (
    <div className="space-y-6 fade">
      <h1 className="text-2xl font-bold text-slate-900">Plan Schedule</h1>
      <p className="text-slate-600 -mt-4 text-sm">Assign a trainer to visit a site. The trainer will log in, see their schedule, and select the attendees on the day.</p>

      <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
        <div className="p-5 grid sm:grid-cols-2 gap-4 border-b border-slate-100 bg-slate-50/50">
          <div><label className="block text-xs font-semibold text-slate-600 mb-1">Site / Location</label>
            <input type="text" value={site} onChange={e=>setSite(e.target.value)} placeholder="e.g. Building A" className="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} /></div>

          <div><label className="block text-xs font-semibold text-slate-600 mb-1">Trainer</label>
            <select value={trainer} onChange={e=>setTrainer(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}}>
              {users.map(u=><option key={u.username} value={u.username}>{u.name}</option>)}
            </select></div>

          <div><label className="block text-xs font-semibold text-slate-600 mb-1">Course</label>
            <select value={course} onChange={e=>setCourse(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}}>
              {courses.map(c=><option key={c.id} value={c.id}>{c.name} {c.audit?'(audit)':`(${c.duration} months)`}</option>)}
            </select></div>

          <div><label className="block text-xs font-semibold text-slate-600 mb-1">Date</label>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} /></div>

          <div className="sm:col-span-2 pt-2"><button onClick={save} disabled={busy} style={{backgroundColor:t.secondary}} className="w-full text-white font-bold py-2.5 rounded-lg hover:brightness-110 shadow-sm transition disabled:opacity-60">{busy?'Saving...':'Schedule session'}</button></div>
        </div>
        {msg && <p className={`px-5 py-4 text-sm font-medium ${msg.bad?'text-red-600':'text-emerald-600'}`}>{msg.text}</p>}
      </div>

      <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
        <div className="p-4 border-b border-slate-100"><h2 className="font-bold text-slate-800">All planned sessions ({planned.length})</h2></div>
        <ul className="divide-y divide-slate-100">
          {planned.length===0 && <li className="p-6 text-slate-400 italic">Nothing planned.</li>}
          {planned.map(s=>{
            const trainerName = users.find(u=>u.username===s.trainer)?.name || s.trainer;
            const courseObj = courses.find(c=>c.id == s.course || c.name == s.course);
            const displayCourse = courseObj ? (courseObj.audit ? `${courseObj.name} (audit)` : `${courseObj.name} (${courseObj.duration}m)`) : s.course;

            return (
              <li key={s.id} className="px-5 py-3.5 flex items-center justify-between hover:bg-slate-50 transition">
                <div>
                  <p className="font-bold text-slate-800">{s.site} <span className="text-slate-500 font-medium text-sm ml-2">({displayCourse})</span></p>
                  <p className="text-xs font-medium text-slate-500 mt-0.5"><span className="text-slate-400">{fmtUK(s.date)}</span> &bull; Trainer: {trainerName}</p>
                </div>
                <button onClick={()=>del(s)} className="text-slate-300 hover:text-red-500 transition p-2"><I.trash size={18}/></button>
              </li>
            );
          })}
        </ul>
      </div>
    </div>
  );
}

/* ---------------- Dashboard ---------------- */
/* Lightweight themed donut (pure SVG, no chart library needed). */
function Donut({ title, segments, size }){
  size=size||150;
  const total=segments.reduce((n,s)=>n+s.value,0);
  const r=size/2, stroke=size*0.15, radius=r-stroke/2, circ=2*Math.PI*radius;
  let offset=0;
  return (
    <div className="flex items-center gap-5">
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="shrink-0">
        <g transform={`rotate(-90 ${r} ${r})`}>
          <circle cx={r} cy={r} r={radius} fill="none" stroke="#eef2f6" strokeWidth={stroke} />
          {total>0 && segments.filter(s=>s.value>0).map((s,i)=>{
            const len=circ*(s.value/total);
            const el=<circle key={i} cx={r} cy={r} r={radius} fill="none" stroke={s.colour} strokeWidth={stroke} strokeDasharray={`${len} ${circ-len}`} strokeDashoffset={-offset} />;
            offset+=len; return el;
          })}
        </g>
        <text x={r} y={r} textAnchor="middle" dominantBaseline="central" style={{fontSize:size*0.26,fontWeight:800,fill:'#0f172a'}}>{total}</text>
        <text x={r} y={r+size*0.21} textAnchor="middle" style={{fontSize:size*0.088,fontWeight:700,fill:'#94a3b8',letterSpacing:'.05em'}}>{String(title).toUpperCase()}</text>
      </svg>
      <div className="space-y-1.5 min-w-0">
        {segments.map((s,i)=>(
          <div key={i} className="flex items-center gap-2 text-sm">
            <span className="w-3 h-3 rounded-sm shrink-0" style={{backgroundColor:s.colour}}></span>
            <span className="text-slate-600 font-medium">{s.label}</span>
            <span className="text-slate-400 ml-auto tabular-nums pl-3">{s.value}{total>0?` \u00b7 ${Math.round(s.value/total*100)}%`:''}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function certState(row){
  if(row.certSent==='audit') return {key:'audit',tone:'blue',label:'Audit'};
  if(!row.expiryDate) return {key:'unknown',tone:'slate',label:'-'};
  const d=daysUntil(row.expiryDate);
  if(d<0) return {key:'expired',tone:'red',label:'Expired'};
  if(d<=90) return {key:'soon',tone:'amber',label:'Expiring soon'};
  return {key:'valid',tone:'green',label:'Valid'};
}

function Employees({ t, employees, reload, patch }){
  const [name,setName]=useState(''); const [email,setEmail]=useState('');
  const [msg,setMsg]=useState(null); const [bulkMsg,setBulkMsg]=useState(null); const [busy,setBusy]=useState(false);
  const [q,setQ]=useState(''); const [dupOnly,setDupOnly]=useState(false);
  const norm=(s)=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
  const nameCounts={}; employees.forEach(e=>{ const k=norm(e.name); nameCounts[k]=(nameCounts[k]||0)+1; });
  const dupCount=Object.keys(nameCounts).filter(k=>nameCounts[k]>1).length;

  const add=async(e)=>{ e.preventDefault(); if(!name.trim())return; setBusy(true); setMsg({bad:false,text:'Adding employee...'});
    const tk=store.get(SESS).token; const r=await api('addEmployee',{token:tk,employee:{name:name.trim(),email:email.trim()}}); setBusy(false);
    if(r.ok){ setName(''); setEmail(''); setMsg({bad:false,text:'Added.'}); reload(); } else setMsg({bad:true,text:errText(r)});
  };
  const onFile=async(e)=>{ const f=e.target.files[0]; if(!f)return; setBulkMsg({bad:false,text:'Uploading...'});
    try{ const wb=XLSX.read(await f.arrayBuffer()); const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
      const emps=rows.map(r=>{ const low={}; Object.keys(r).forEach(k=>low[k.toString().trim().toLowerCase()]=r[k]); return {name:String(low.name||'').trim(),email:String(low.email||'').trim()}; }).filter(x=>x.name);
      if(emps.length===0){ setBulkMsg({bad:true,text:'No rows found. Needs columns: name, email.'}); e.target.value=''; return; }
      const tk=store.get(SESS).token; const r=await api('bulkAddEmployees',{token:tk,employees:emps});
      if(r.ok){ setBulkMsg({bad:false,text:`Added ${r.added} employees.`}); reload(); } else setBulkMsg({bad:true,text:errText(r)});
    }catch(err){ setBulkMsg({bad:true,text:'Could not read that file.'}); }
    e.target.value='';
  };
  const del=async(emp)=>{
    if(!window.confirm('Remove '+emp.name+'?'))return;
    patch.removeEmployee(emp.id);
    const tk=store.get(SESS).token;
    const r=await api('deleteEmployee',{token:tk,id:emp.id});
    if(!r||!r.ok){ alert('Could not remove '+emp.name+'.'); reload(); }
  };
  return (
    <div className="space-y-6 fade">
      <h1 className="text-2xl font-bold text-slate-900">Employees</h1>
      <p className="text-slate-600 -mt-4 text-sm">The people who receive training. They do not log in; their certificate is emailed to the address here.</p>
      <div className="grid lg:grid-cols-2 gap-6 items-start">
        <form onSubmit={add} className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div style={{backgroundColor:t.primary}} className="px-5 py-3.5 text-white font-bold flex items-center gap-2"><I.plus size={18}/> Add one</div>
          <div className="p-5 space-y-3">
            <div><label className="block text-xs font-semibold text-slate-600 mb-1">Full name</label><input disabled={busy} value={name} onChange={e=>setName(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} /></div>
            <div><label className="block text-xs font-semibold text-slate-600 mb-1">Email (cert goes here)</label><input disabled={busy} type="email" value={email} onChange={e=>setEmail(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} /></div>
            {msg && <p className={`text-sm font-medium ${msg.bad?'text-red-600':'text-emerald-600'}`}>{msg.text}</p>}
            <button disabled={busy} style={{backgroundColor:t.secondary}} className="w-full text-white font-bold py-2.5 rounded-lg hover:brightness-110 shadow-sm transition disabled:opacity-60">{busy?'Working...':'Add employee'}</button>
          </div>
        </form>
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div style={{backgroundColor:t.primary}} className="px-5 py-3.5 text-white font-bold flex items-center gap-2"><I.up size={18}/> Bulk upload (Excel)</div>
          <div className="p-5 space-y-3 text-sm text-slate-600">
            <p>Spreadsheet with columns: <b>name, email</b>. One row per person.</p>
            <label className="flex items-center justify-center gap-2 border-2 border-dashed border-slate-300 rounded-lg py-8 cursor-pointer hover:border-slate-400 bg-slate-50 hover:bg-slate-100 transition" style={{color:t.primary}}><I.up size={20}/> <span className="font-semibold text-base">Choose .xlsx or .csv</span><input type="file" accept=".xlsx,.xls,.csv" onChange={onFile} className="hidden" /></label>
            {bulkMsg && <p className={`font-medium ${bulkMsg.bad?'text-red-600':'text-emerald-600'}`}>{bulkMsg.text}</p>}
          </div>
        </div>
      </div>
      <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
        <div className="p-4 border-b border-slate-100 flex flex-wrap items-center justify-between gap-3">
          <h2 className="font-bold text-slate-800">All employees ({employees.length})</h2>
          <div className="flex items-center gap-2">
            <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search name or email" className="border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} />
            <button onClick={()=>setDupOnly(v=>!v)} title="Show only names that appear more than once" className={`px-3 py-1.5 rounded-lg text-sm font-semibold border transition ${dupOnly?'text-white border-transparent':'text-slate-600 border-slate-300 hover:bg-slate-50'}`} style={dupOnly?{backgroundColor:t.secondary}:{}}>Duplicates{dupCount?` (${dupCount})`:''}</button>
          </div>
        </div>
        {(() => {
          let list=employees.slice();
          if(q){ const ql=q.toLowerCase(); list=list.filter(e=>String(e.name).toLowerCase().includes(ql)||String(e.email||'').toLowerCase().includes(ql)); }
          if(dupOnly) list=list.filter(e=>nameCounts[norm(e.name)]>1);
          list.sort((a,b)=>String(a.name).localeCompare(String(b.name)));
          if(list.length===0) return <ul className="divide-y divide-slate-100"><li className="p-6 text-slate-400 italic">{dupOnly?'No duplicate names found.':(q?'No matches.':'None yet.')}</li></ul>;
          return (
            <ul className="divide-y divide-slate-100">
              {list.map(e=>{
                const isDup=nameCounts[norm(e.name)]>1;
                return (
                  <li key={e.id} className="px-5 py-3.5 flex items-center justify-between hover:bg-slate-50 transition">
                    <div className="min-w-0">
                      <p className="font-bold text-slate-800 flex items-center gap-2">{e.name} {isDup && <Badge tone="amber">duplicate</Badge>}</p>
                      <p className="text-xs font-medium text-slate-500 mt-0.5">{e.email||'no email'}</p>
                    </div>
                    <button onClick={()=>del(e)} title="Remove employee" className="text-slate-300 hover:text-red-500 transition p-2 shrink-0"><I.trash size={18}/></button>
                  </li>
                );
              })}
            </ul>
          );
        })()}
      </div>
    </div>
  );
}

      <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
        <div className="p-4 border-b border-slate-100"><h2 className="font-bold text-slate-800">All logins ({users.length})</h2></div>
        <div className="overflow-x-auto"><table className="w-full text-sm"><thead className="bg-slate-50 text-slate-500 text-left border-b border-slate-200"><tr><th className="px-4 py-3 font-semibold">Name</th><th className="px-4 py-3 font-semibold">Username</th><th className="px-4 py-3 font-semibold">Email</th><th className="px-4 py-3 font-semibold">Qualification</th><th className="px-4 py-3 font-semibold">Access</th><th className="px-4 py-3"></th></tr></thead>
          <tbody>{users.map(u=><tr key={u.username} className="border-t border-slate-100 hover:bg-slate-50 transition"><td className="px-4 py-3 font-bold text-slate-800">{u.name}</td><td className="px-4 py-3 text-slate-600 font-mono text-xs">{u.username}</td><td className="px-4 py-3 text-slate-600">{u.email||'-'}</td><td className="px-4 py-3 text-slate-600">{u.qual||<span className="text-amber-600 font-medium">not set</span>}</td><td className="px-4 py-3"><Badge tone={u.role==='superadmin'?'blue':u.role==='admin'?'green':'slate'}>{roleLabel(u.role)}</Badge></td><td className="px-4 py-3 text-right"><div className="flex items-center justify-end gap-2"><button onClick={()=>openEdit(u)} title="Edit login" className="text-slate-300 hover:text-sky-600 transition p-1"><I.pencil size={17}/></button>{u.username!==me.username && <button onClick={()=>del(u)} title="Remove login" className="text-slate-300 hover:text-red-500 transition p-1"><I.trash size={18}/></button>}</div></td></tr>)}</tbody>
        </table></div>
      </div>
      {edit && (
        <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50 fade" onClick={()=>!editBusy&&setEdit(null)}>
          <div onClick={e=>e.stopPropagation()} className="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden">
            <div style={{backgroundColor:t.primary}} className="px-6 py-4 text-white font-bold flex items-center gap-2"><I.pencil size={18}/> Edit {edit.username}</div>
            <div className="p-6 space-y-3">
              <div><label className="block text-xs font-semibold text-slate-600 mb-1">Full name</label><input disabled={editBusy} value={edit.name} onChange={e=>setEdit(x=>Object.assign({},x,{name:e.target.value}))} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} /></div>
              <div><label className="block text-xs font-semibold text-slate-600 mb-1">Email</label><input disabled={editBusy} type="email" value={edit.email} onChange={e=>setEdit(x=>Object.assign({},x,{email:e.target.value}))} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} /></div>
              <div><label className="block text-xs font-semibold text-slate-600 mb-1">Qualification (shows on certs they issue)</label><input disabled={editBusy} value={edit.qual} onChange={e=>setEdit(x=>Object.assign({},x,{qual:e.target.value}))} placeholder="e.g. QQI Level 6" className="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} /></div>
              {canMakeAdmin && edit.role!=='superadmin' && <div><label className="block text-xs font-semibold text-slate-600 mb-1">Access</label><select disabled={editBusy} value={edit.role} onChange={e=>setEdit(x=>Object.assign({},x,{role:e.target.value}))} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 bg-white focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}}><option value="user">Trainer</option><option value="admin">Admin</option></select></div>}
              <p className="text-xs text-slate-400">To change a password, the person uses the Password button after signing in.</p>
              {editMsg && <p className="text-sm text-red-600 font-medium">{editMsg}</p>}
              <div className="flex gap-3 pt-1"><button disabled={editBusy} onClick={()=>setEdit(null)} className="flex-1 border border-slate-300 rounded-lg py-2.5 text-slate-600 font-semibold hover:bg-slate-50 transition disabled:opacity-60">Cancel</button><button disabled={editBusy} onClick={saveEdit} style={{backgroundColor:t.secondary}} className="flex-1 text-white font-bold py-2.5 rounded-lg hover:brightness-110 shadow-sm transition disabled:opacity-60">{editBusy?'Saving...':'Save'}</button></div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------- Change password ---------------- */
function ChangePassword({ t, onClose }){
  const [cur,setCur]=useState(''); const [nw,setNw]=useState(''); const [cf,setCf]=useState(''); const [msg,setMsg]=useState(null); const [busy,setBusy]=useState(false);
  const submit=async(e)=>{ e.preventDefault(); setMsg(null);
    if(nw.length<6){ setMsg({bad:true,text:'New password must be at least 6 characters.'}); return; }
    if(nw!==cf){ setMsg({bad:true,text:'The new passwords do not match.'}); return; }
    setBusy(true); setMsg({bad:false,text:'Saving...'});
    try{ const tk=store.get(SESS).token; const r=await api('changePassword',{token:tk,currentPassword:cur,newPassword:nw}); setBusy(false);
      if(r.ok){ setMsg({bad:false,text:'Password changed.'}); setCur('');setNw('');setCf(''); }
      else if(r.error==='bad_current') setMsg({bad:true,text:'Current password is wrong.'});
      else setMsg({bad:true,text:'Could not change password.'});
    }catch(e){ setBusy(false); setMsg({bad:true,text:'Could not reach the server.'}); }
  };
  return (
    <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50 fade" onClick={onClose}>
      <form onClick={e=>e.stopPropagation()} onSubmit={submit} className="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden">
        <div style={{backgroundColor:t.primary}} className="px-6 py-4 text-white font-bold flex items-center gap-2"><I.lock size={18}/> Change password</div>
        <div className="p-6 space-y-3">
          <input disabled={busy} type="password" placeholder="Current password" value={cur} onChange={e=>setCur(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} />
          <input disabled={busy} type="password" placeholder="New password" value={nw} onChange={e=>setNw(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} />
          <input disabled={busy} type="password" placeholder="Confirm new password" value={cf} onChange={e=>setCf(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:outline-none" style={{'--tw-ring-color':t.primary}} />
          {msg && <p className={`text-sm font-medium ${msg.bad?'text-red-600':'text-emerald-600'}`}>{msg.text}</p>}
          <div className="flex gap-3 pt-2"><button disabled={busy} type="button" onClick={onClose} className="flex-1 border border-slate-300 rounded-lg py-2.5 text-slate-600 font-semibold hover:bg-slate-50 transition disabled:opacity-60">Close</button><button disabled={busy} style={{backgroundColor:t.secondary}} className="flex-1 text-white font-bold py-2.5 rounded-lg hover:brightness-110 shadow-sm transition disabled:opacity-60">{busy?'Working...':'Save'}</button></div>
        </div>
      </form>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
(function(){
  try{
    var src=document.getElementById('appsrc').textContent;
    var out=Babel.transform(src,{presets:[['react',{runtime:'classic',pragma:'React.createElement',pragmaFrag:'React.Fragment'}]]}).code;
    (0,eval)(out);
  }catch(err){
    var root=document.getElementById('root');
    if(root) root.innerHTML='<pre style="padding:20px;color:#b00020;white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,monospace">Startup error:\n\n'+((err&&err.message)||err)+'</pre>';
    throw err;
  }
})();
</script>
